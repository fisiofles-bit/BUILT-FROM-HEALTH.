<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Built From Health · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#101215;           /* barra lateral */
  --bg:#0A0B0D;            /* fondo negro */
  --surface:#16191D;
  --text:#E7EAED;
  --muted:#8A94A0;
  --line:#282D34;
  --accent:#00B2FF;
  --accent-press:#33C1FF;
  --accent-tint:rgba(0,178,255,.15);
  --on-accent:#04222E;
  --red-text:#FF6B7A;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.42);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}
.mono{font-family:'Space Mono',monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}

/* ---------- Sidebar vertical ---------- */
.sidebar{width:236px;flex-shrink:0;background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:22px 14px;gap:4px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.brand .logo{width:48px;height:48px;flex-shrink:0;object-fit:contain}
.brand .wordmark{height:36px;width:auto;display:block}
.brandtxt b{font-family:'Space Grotesk';font-weight:700;font-size:15px;line-height:1.1;display:block;text-transform:uppercase;letter-spacing:.04em}
.brandtxt span{font-size:10px;color:#9AA6B0;letter-spacing:.16em;text-transform:uppercase;display:block;margin-top:3px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;border:0;cursor:pointer;background:transparent;color:#AEB8C0;font:inherit;font-size:14px;font-weight:500;padding:11px 12px;border-radius:10px;text-align:left;transition:.15s;position:relative}
.nav-btn svg{width:18px;height:18px;flex-shrink:0}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-btn.active{background:var(--accent);color:var(--on-accent);font-weight:600}
.nav-btn.active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);border-left:6px solid var(--accent);border-top:5px solid transparent;border-bottom:5px solid transparent}
.side-foot{margin-top:auto;font-size:11px;color:#7A858E;padding:12px 8px 0;line-height:1.5;border-top:1px solid rgba(255,255,255,.08)}
#storeState{color:var(--accent)}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;padding:34px 40px 60px;max-width:1120px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.page-head .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.page-head h1{font-size:30px;font-weight:700;margin-top:4px}
.page-head p{color:var(--muted);font-size:14px;margin-top:6px;max-width:560px;line-height:1.5}
.btn{border:0;cursor:pointer;font:inherit;font-weight:600;font-size:14px;padding:10px 16px;border-radius:10px;background:var(--accent);color:var(--on-accent);transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--accent-press)}
.btn.ghost{background:#1B1F24;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:7px 12px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:28px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.kpi .label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi .val{font-family:'Space Grotesk';font-weight:700;font-size:30px;margin-top:8px;line-height:1}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:7px}
.kpi.pos .val{color:var(--accent-press)}
.kpi.neg .val{color:var(--red-text)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:15px;font-weight:600}
.panel-body{padding:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:12px 20px;border-bottom:1px solid var(--line)}
td{padding:13px 20px;border-bottom:1px solid var(--line);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:#1C2026}
.num{font-family:'Space Mono',monospace;font-variant-numeric:tabular-nums}
.pos{color:var(--accent-press)}
.neg{color:var(--red-text)}
.del{background:transparent;border:0;cursor:pointer;color:var(--muted);padding:5px;border-radius:6px}
.del:hover{color:var(--red-text);background:rgba(226,59,78,.15)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--text);font-family:'Space Grotesk';margin-bottom:5px;font-size:16px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
.b-cyan{background:rgba(0,178,255,.16);color:#7FD6FF}
.b-amber{background:rgba(232,147,12,.18);color:#F2B657}
.b-red{background:rgba(226,59,78,.18);color:#FF8A97}
.b-ink{background:#24282E;color:#C6CDD5}
.b-gray{background:#22262B;color:#8A94A0}
.b-green{background:rgba(52,211,153,.16);color:#6EE7B7}
.ev-venc.urg{background:rgba(232,147,12,.22);color:#F2B657}
.b-abanca{background:rgba(37,99,235,.18);color:#7FB0FF}
.b-stripe{background:rgba(124,92,255,.20);color:#C4B5FD}
.b-hotmart{background:rgba(226,59,78,.16);color:#FF8A97}
.urg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.urg-alta{background:#FF6B7A}
.urg-media{background:#F2B657}
.urg-baja{background:#34D399}
.crm-stage{border-bottom:1px solid var(--line)}
.crm-stage:last-child{border-bottom:0}
.crm-stage-h{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;padding:10px 20px 6px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.crm-stage-h span{background:#22262B;border-radius:20px;padding:1px 8px;margin-left:4px;font-size:12px}
.crm-card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 20px;flex-wrap:wrap}
.crm-card:hover{background:#1C2026}
.crm-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.crm-val{color:var(--accent-press);font-family:'Space Mono',monospace;font-size:13px}
.crm-actions{display:flex;align-items:center;gap:8px}
.crm-actions select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#0E1013;color:var(--text)}
.buscador{font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#0E1013;color:var(--text);width:100%;max-width:340px}
.buscador:focus{outline:2px solid var(--accent-tint);border-color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:16px 20px;background:#12151A;border-bottom:1px solid var(--line)}
.form-grid.hidden{display:none}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#0E1013;color:var(--text);width:100%}
.field input::placeholder,.field textarea::placeholder{color:#5A636D}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-tint);border-color:var(--accent)}
.field.full{grid-column:1/-1}
.form-actions{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end}
.filterbar{display:flex;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);align-items:flex-end}
.filterbar .field{min-width:150px}
.muted-mini{font-size:12px;color:var(--muted);text-transform:capitalize}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:13px 20px;border-bottom:1px solid var(--line)}
.aviso:last-child{border-bottom:0}
.aviso b{display:block;font-size:14px;font-weight:600}
.aviso>div>span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.aviso span[class^="dot-"]{display:inline-block;width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0}
.dot-cyan{background:var(--accent)} .dot-amber{background:#F2B657} .dot-red{background:#FF6B7A}
.catbar{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.dayrow{display:flex;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line)}
.dayrow:last-child{border-bottom:0}
.dayrow.is-today{background:rgba(0,178,255,.06)}
.dayhead{width:118px;flex-shrink:0;font-weight:600;font-size:14px;font-family:'Space Grotesk',sans-serif}
.dayhead span{display:block;font-size:12px;color:var(--muted);font-family:'Inter',sans-serif;font-weight:500}
.daytasks{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.noday{color:#3C434B;font-size:13px}
.task{display:flex;align-items:center;gap:10px}
.task-t{flex:1;font-size:14px;min-width:0}
.task.done .task-t{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;border:1.5px solid var(--line);border-radius:6px;background:transparent;color:var(--accent);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.task.done .chk{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.catchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:transparent;border:1px solid var(--c);color:var(--c)}
.catchip.sm{padding:2px 8px;font-size:11px}
.catchip button{background:transparent;border:0;color:inherit;cursor:pointer;opacity:.6;padding:0;font-size:11px;line-height:1}
.catchip button:hover{opacity:1}
@media(max-width:860px){.dayhead{width:84px}}
#login-gate{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:34px 30px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.login-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.06em;font-size:20px;text-align:center}
.login-sub{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.16em;text-align:center;margin-bottom:10px}
.login-card input{font:inherit;font-size:14px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#0E1013;color:var(--text)}
.login-card input:focus{outline:2px solid var(--accent-tint);border-color:var(--accent)}
.login-card .btn{justify-content:center;margin-top:4px}
.login-err{color:#FF8A97;font-size:13px;min-height:18px;text-align:center}
.seg-row{display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid var(--line)}
.seg-row:last-child{border-bottom:0}
.seg-name{flex:1;font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg-days{font-size:12px;color:var(--muted);white-space:nowrap}
.seg-days.neg{color:var(--red-text);font-weight:600}
.prov{color:var(--muted);font-size:11px}
.who{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 8px;white-space:nowrap}
.fx-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.fx-actions{display:flex;gap:10px}
.fx-doc{background:#fff;color:#111;width:100%;max-width:720px;padding:40px;border-radius:8px;font-size:14px}
.fx-top{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px}
.fx-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;letter-spacing:-.01em}
.fx-num{font-weight:600;margin-top:4px}
.fx-box{border:1px solid #ddd;border-radius:6px;padding:12px 14px;margin-bottom:14px;line-height:1.5}
.fx-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#888;font-weight:700;margin-bottom:4px}
.fx-table{width:100%;border-collapse:collapse;margin:8px 0}
.fx-table th{background:#f4f4f4;color:#333;padding:8px 10px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.fx-table td{padding:10px;border-bottom:1px solid #eee}
.fx-tot{margin-left:auto;max-width:300px;margin-top:8px}
.fx-tot>div{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.fx-tot .fx-total{border-top:2px solid #111;margin-top:6px;padding-top:8px;font-weight:700;font-size:17px;font-family:'Space Grotesk',sans-serif}
.fx-pay{margin-top:18px;font-size:13px;color:#444}
.fx-note{margin-top:8px;font-size:12px;color:#666}
@media print{ body.printing *{visibility:hidden} body.printing #fx-print, body.printing #fx-print *{visibility:visible} #fx-print{position:absolute;left:0;top:0;width:100%;padding:0} .fx-overlay{position:static;background:#fff;padding:0} .fx-actions{display:none} }
.cal-top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.cal-top .month{font-family:'Space Grotesk';font-weight:600;font-size:17px;text-transform:capitalize}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:34px;height:34px;border:1px solid var(--line);background:#1B1F24;border-radius:9px;cursor:pointer;font-size:16px;color:var(--text)}
.cal-nav button:hover{border-color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
.cal-cell{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;position:relative;transition:.12s}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell:hover{background:#1C2026}
.cal-cell.out{background:#101215;color:#3C434B;cursor:default}
.cal-cell.out:hover{background:#101215}
.cal-cell .dnum{font-size:13px;font-weight:600;color:var(--muted)}
.cal-cell.today .dnum{background:var(--accent);color:var(--on-accent);width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.ev-chip{font-size:11px;background:rgba(0,178,255,.16);color:#7FD6FF;border-radius:5px;padding:2px 5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ev-venc{font-size:11px;background:rgba(167,139,250,.20);color:#C4B5FD;border-radius:5px;padding:2px 5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.info{background:#12151A;border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:14px;color:var(--muted);line-height:1.6}
.info b{color:var(--text)}
.info ol{margin:8px 0 0 18px}
.info li{margin-bottom:4px}

/* ---------- Móvil: pestañas siguen VERTICALES (rail de iconos) ---------- */
@media(max-width:860px){
  .sidebar{width:66px;padding:16px 8px;gap:6px}
  .brand{justify-content:center;padding:2px 0 16px;gap:0}
  .brandtxt{display:none}
  .brand .logo{width:42px;height:42px}
  .nav-btn{justify-content:center;padding:12px 0}
  .nav-btn .lbl{display:none}
  .nav-btn.active::before{display:none}
  .side-foot{display:none}
  .main{padding:22px 16px 60px}
  .page-head h1{font-size:23px}
  th:nth-child(n+4),td:nth-child(n+4){display:none}
  .cal-cell{min-height:60px}
  .kpi .val{font-size:26px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
</head>
<body>

<script>
// ===== Conexión Supabase =====
const SB_URL='https://vxxhkuizeceutbowxcmq.supabase.co';
const SB_KEY='sb_publishable_czwCWuPJQYKiZzvHRaQlVQ_Z9EsbAP3';
const sb=window.supabase.createClient(SB_URL, SB_KEY);
let loaded=false;
let state={ finanzas:[], altas:[], videollamadas:[], eventos:[], tareas:[], tareaCats:[], equipo:[], emisor:{}, facturas:[], leads:[] };

const SPECS={
  altas:{table:'clientes',cols:[['nombre','nombre'],['deporte','deporte'],['lesion','lesion'],['entrenador','entrenador_id'],['fechaAlta','fecha_alta'],['tarifa','tarifa','num'],['estado','estado'],['nif','nif'],['direccion','direccion'],['ultimoContacto','ultimo_contacto'],['email','email'],['diaCobro','dia_cobro','num'],['fechaVencimiento','fecha_vencimiento'],['tipoCliente','tipo_cliente']]},
  finanzas:{table:'finanzas',cols:[['fecha','fecha'],['tipo','tipo'],['concepto','concepto'],['categoria','categoria'],['importe','importe','num'],['cliente','cliente_id'],['stripeInvoice','stripe_invoice'],['fuente','fuente_pago']]},
  videollamadas:{table:'videollamadas',cols:[['atleta','atleta'],['fecha','fecha'],['hora','hora'],['plataforma','plataforma'],['estado','estado'],['notas','notas'],['tipoLead','tipo_lead'],['realizadaPor','realizada_por'],['resultado','resultado'],['importe','importe','num']]},
  eventos:{table:'eventos',cols:[['titulo','titulo'],['fecha','fecha'],['hora','hora'],['duracion','duracion','num'],['notas','notas']]},
  tareas:{table:'tareas',cols:[['titulo','titulo'],['categoria','categoria'],['asignado','asignado_id'],['fecha','fecha'],['hecha','hecha','bool'],['urgencia','urgencia']]},
  equipo:{table:'equipo',cols:[['nombre','nombre'],['rol','rol'],['email','email'],['notas','notas']]},
  facturas:{table:'facturas',cols:[['numero','numero'],['fecha','fecha'],['tipo','tipo'],['periodo','periodo'],['concepto','concepto'],['clienteNombre','cliente_nombre'],['clienteNif','cliente_nif'],['clienteDir','cliente_dir'],['base','base','num'],['ivaPct','iva_pct','num'],['ivaCuota','iva_cuota','num'],['irpfPct','irpf_pct','num'],['irpfCuota','irpf_cuota','num'],['total','total','num'],['origen','origen_id'],['estado','estado']]},
  leads:{table:'leads',cols:[['nombre','nombre'],['email','email'],['telefono','telefono'],['fuente','fuente'],['etapa','etapa'],['valor','valor','num'],['tipo','tipo'],['asignado','asignado_id'],['notas','notas']]}
};
function rowToDB(coll,r){ var o={id:r.id}; var cols=SPECS[coll].cols; for(var i=0;i<cols.length;i++){ var a=cols[i][0],d=cols[i][1]; var v=r[a]; if(v===undefined||v==='') v=null; o[d]=v; } return o; }
function rowFromDB(coll,r){ var o={id:r.id}; var cols=SPECS[coll].cols; for(var i=0;i<cols.length;i++){ var a=cols[i][0],d=cols[i][1],t=cols[i][2]; var v=r[d]; if(t==='num') v=(v==null?0:Number(v)); else if(t==='bool') v=!!v; else v=(v==null?'':v); o[a]=v; } return o; }

async function loadAll(){
  for(var coll in SPECS){
    var res=await sb.from(SPECS[coll].table).select('*');
    if(res.error){ console.error(SPECS[coll].table,res.error); state[coll]=[]; }
    else { (function(c,data){ state[c]=data.map(function(r){return rowFromDB(c,r);}); })(coll,res.data||[]); }
  }
  var tc=await sb.from('tarea_categorias').select('nombre');
  state.tareaCats=(tc.data||[]).map(function(x){return x.nombre;});
  var cf=await sb.from('config').select('*').eq('id',1).single();
  var c=cf.data||{};
  state.emisor={nombre:c.emisor_nombre||'',nif:c.emisor_nif||'',direccion:c.emisor_direccion||'',email:c.emisor_email||'',iban:c.emisor_iban||'',ivaDefault:(c.iva_default!=null?Number(c.iva_default):0),tipoDefault:c.tipo_default||'auto',saldoBanco:(c.saldo_banco!=null?Number(c.saldo_banco):0)};
  var sr=await sb.from('factura_series').select('*');
  state.series={}; (sr.data||[]).forEach(function(r){ state.series[r.serie+'|'+r.anio]=r.ultimo; });
  loaded=true;
}

var saving=false, saveQueued=false;
async function save(){
  if(!loaded) return;
  if(saving){ saveQueued=true; return; }
  saving=true;
  try{
    for(var coll in SPECS){
      var rows=(state[coll]||[]).map(function(r){return rowToDB(coll,r);});
      if(rows.length){ var up=await sb.from(SPECS[coll].table).upsert(rows); if(up.error) console.error('upsert',SPECS[coll].table,up.error); }
    }
    var cats=state.tareaCats||[];
    if(cats.length){ await sb.from('tarea_categorias').upsert(cats.map(function(n){return {nombre:n};})); }
    var em=state.emisor||{};
    await sb.from('config').update({emisor_nombre:em.nombre||null,emisor_nif:em.nif||null,emisor_direccion:em.direccion||null,emisor_email:em.email||null,emisor_iban:em.iban||null,iva_default:(em.ivaDefault||0),tipo_default:(em.tipoDefault||'auto'),saldo_banco:(em.saldoBanco||0)}).eq('id',1);
  }catch(e){ console.error(e); }
  saving=false;
  if(saveQueued){ saveQueued=false; save(); }
}

function lineChart(series, labels){
  var W=640,H=220,padL=52,padR=16,padT=14,padB=26;
  var all=[]; series.forEach(function(s){ all=all.concat(s.values); });
  var max=Math.max.apply(null, all.concat([0])); if(max<=0) max=1;
  var n=labels.length;
  function X(i){ return padL+(W-padL-padR)*(n<=1?0:(i/(n-1))); }
  function Y(v){ return padT+(H-padT-padB)*(1-v/max); }
  var grid=''; var ticks=4;
  for(var t=0;t<=ticks;t++){ var gv=max*t/ticks; var gy=Y(gv); grid+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--line)" stroke-width="1"/><text x="'+(padL-8)+'" y="'+(gy+3)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+Math.round(gv)+'</text>'; }
  var xlabels=labels.map(function(l,i){ return '<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+esc(l)+'</text>'; }).join('');
  var paths=series.map(function(s){ var pts=s.values.map(function(v,i){ return X(i)+','+Y(v); }).join(' '); var dots=s.values.map(function(v,i){ return '<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3" fill="'+s.color+'"/>'; }).join(''); return '<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots; }).join('');
  var legend=series.map(function(s){ return '<span style="display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:12px;color:var(--muted)"><span style="width:10px;height:10px;border-radius:50%;background:'+s.color+';display:inline-block"></span>'+esc(s.name)+'</span>'; }).join('');
  return '<div style="padding:16px 20px">'+legend+'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;margin-top:8px">'+grid+paths+xlabels+'</svg></div>';
}

function viewCalendario(){
  const y=calRef.getFullYear(), m=calRef.getMonth();
  let inicio=new Date(y,m,1).getDay(); inicio=(inicio===0?6:inicio-1);
  const diasMes=new Date(y,m+1,0).getDate(); const hoyStr=hoy(); let cells='';
  const prevDias=new Date(y,m,0).getDate();
  for(let i=inicio-1;i>=0;i--) cells+=`<div class="cal-cell out"><span class="dnum">${prevDias-i}</span></div>`;
  for(let d=1;d<=diasMes;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=state.eventos.filter(e=>e.fecha===ds).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
    const chips=evs.slice(0,3).map(e=>`<div class="ev-chip">${e.hora?esc(e.hora)+' ':''}${esc(e.titulo)}</div>`).join('')+(evs.length>3?`<div class="ev-chip" style="background:rgba(255,255,255,.07);color:var(--muted)">+${evs.length-3} más</div>`:'');
    const rchips=recsDelDia(ds).slice(0,2).map(function(t){return '<div class="ev-venc'+(t.urg?' urg':'')+'">'+esc(t.txt)+'</div>';}).join('');
    cells+=`<div class="cal-cell ${ds===hoyStr?'today':''}" onclick="nuevoEvento('${ds}')"><span class="dnum">${d}</span>${chips}${rchips}</div>`;
  }
  const totalCeldas=inicio+diasMes;
  for(let i=0;i<(7-totalCeldas%7)%7;i++) cells+=`<div class="cal-cell out"><span class="dnum">${i+1}</span></div>`;
  const listaFut=[...state.eventos].filter(e=>e.fecha>=hoyStr).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  return `
  <div class="page-head"><div><div class="eyebrow">Agenda</div><h1>Calendario</h1>

    <div class="cal-top"><div class="month">${meses[m]} ${y}</div><div class="cal-nav"><button onclick="calMove(-1)">‹</button><button onclick="calHoy()">Hoy</button><button onclick="calMove(1)">›</button></div></div>
    <div class="cal-grid">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
  </div>

    ${listaFut.length?`<table><thead><tr><th>Evento</th><th>Fecha</th><th>Hora</th><th>Enviar al móvil</th><th></th></tr></thead><tbody>
    ${listaFut.map(e=>`<tr><td><b>${esc(e.titulo)}</b>${e.notas?`<br><span style="color:var(--muted);font-size:12px">${esc(e.notas)}</span>`:''}</td><td class="num">${fFecha(e.fecha)}</td><td class="num">${esc(e.hora||'—')}</td><td><a class="btn ghost sm" href="${gcalLink(e)}" target="_blank" rel="noopener">Google</a> <button class="btn ghost sm" onclick="descargarICS('${e.id}')">.ics</button></td><td style="text-align:right"><button class="del" onclick="delItem('eventos','${e.id}')">✕</button></td></tr>`).join('')}

  </div></div>`;

function icsStamp(fecha,hora,addMin){
  const [y,mo,d]=fecha.split('-').map(Number); const [h,mi]=(hora||'09:00').split(':').map(Number);
  const dt=new Date(y,mo-1,d,h||0,mi||0); if(addMin) dt.setMinutes(dt.getMinutes()+addMin);
  const p=n=>String(n).padStart(2,'0');
  return `${dt.getFullYear()}${p(dt.getMonth()+1)}${p(dt.getDate())}T${p(dt.getHours())}${p(dt.getMinutes())}00`;
}
function gcalLink(e){
  const ini=icsStamp(e.fecha,e.hora||'09:00',0), fin=icsStamp(e.fecha,e.hora||'09:00',e.duracion||60);
  const u=new URLSearchParams({action:'TEMPLATE',text:e.titulo,dates:`${ini}/${fin}`,details:e.notas||''});
  return 'https://calendar.google.com/calendar/render?'+u.toString();
}
function eventoICS(e){
  return ['BEGIN:VEVENT',`UID:${e.id}@bfh`,`DTSTAMP:${icsStamp(hoy(),'09:00',0)}`,`DTSTART:${icsStamp(e.fecha,e.hora||'09:00',0)}`,`DTEND:${icsStamp(e.fecha,e.hora||'09:00',e.duracion||60)}`,`SUMMARY:${e.titulo}`,e.notas?`DESCRIPTION:${e.notas}`:'','END:VEVENT'].filter(Boolean).join('\r\n');
}
function bajarArchivo(nombre,contenido,tipo){
  const blob=new Blob([contenido],{type:tipo||'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nombre; a.click(); URL.revokeObjectURL(a.href);
}
function descargarICS(id){ const e=state.eventos.find(x=>x.id===id); if(!e) return; bajarArchivo(`${e.titulo}.ics`,`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//BuiltFromHealth//Panel//ES\r\n${eventoICS(e)}\r\nEND:VCALENDAR`,'text/calendar'); }
function exportarICS(){ if(!state.eventos.length){ alert('No hay eventos que exportar.'); return; } bajarArchivo('agenda-bfh.ics',`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//BuiltFromHealth//Panel//ES\r\n${state.eventos.map(eventoICS).join('\r\n')}\r\nEND:VCALENDAR`,'text/calendar'); }

function saveEmisor(){ const iv=document.getElementById('em-iva'), tp=document.getElementById('em-tipo'); state.emisor={nombre:val('em-nombre'),nif:val('em-nif'),direccion:val('em-dir'),email:val('em-email'),iban:val('em-iban'),ivaDefault:iv?+iv.value:0,tipoDefault:tp?tp.value:'auto'}; save(); render(); }
function rellenaCliente(){ const c=state.altas.find(x=>x.id===document.getElementById('fac-cli').value); if(c){ document.getElementById('fac-clinom').value=c.nombre||''; document.getElementById('fac-clinif').value=c.nif||''; document.getElementById('fac-clidir').value=c.direccion||''; } }
function toggleFacFields(){ const nom=document.getElementById('fac-tipo').value==='nominativa'; document.querySelectorAll('.fac-nom').forEach(el=>el.style.display=nom?'':'none'); }
async function siguienteNumero(tipo){

  try{ var r=await sb.rpc('next_factura_numero',{p_serie:tipo,p_anio:anio}); if(!r.error&&r.data) return r.data; }catch(e){ console.error(e); }
  return null;
}
async function addFactura(){
  var base=parseFloat(document.getElementById('fac-base').value);
  if(isNaN(base)){ alert('Indica la base imponible.'); return; }
  var tipo=document.getElementById('fac-tipo').value;
  var ivaPct=+document.getElementById('fac-iva').value;
  var irpfPct=+document.getElementById('fac-irpf').value||0;
  var ivaCuota=base*ivaPct/100, irpfCuota=base*irpfPct/100, total=base+ivaCuota-irpfCuota;
  var fac={id:uid(),numero:'',estado:'borrador',fecha:val('fac-fecha')||hoy(),tipo:tipo,periodo:document.getElementById('fac-periodo').value,concepto:val('fac-concepto')||'Servicio',clienteNombre:val('fac-clinom'),clienteNif:val('fac-clinif'),clienteDir:val('fac-clidir'),base:base,ivaPct:ivaPct,ivaCuota:ivaCuota,irpfPct:irpfPct,irpfCuota:irpfCuota,total:total,origen:''};
  if(!state.facturas) state.facturas=[];
  state.facturas.push(fac);
  toggleForm('fac-form'); save(); render();
}
function facturaDocHTML(f){

    <div class="fx-box"><div class="fx-h">Emisor</div><b>${esc(em.nombre||'')}</b>${em.nif?`<div>NIF: ${esc(em.nif)}</div>`:''}${em.direccion?`<div>${esc(em.direccion)}</div>`:''}${em.email?`<div>${esc(em.email)}</div>`:''}</div></div>
    ${dest}
    <table class="fx-table"><thead><tr><th>Concepto</th><th style="text-align:right">Importe</th></tr></thead><tbody><tr><td>${esc(f.concepto)}${f.periodo?` (${esc(f.periodo)})`:''}</td><td style="text-align:right">${eur(f.base)}</td></tr></tbody></table>
    <div class="fx-tot">
      <div><span>Base imponible</span><span>${eur(f.base)}</span></div>
      <div><span>IVA (${f.ivaPct}%)</span><span>${eur(f.ivaCuota)}</span></div>
      ${f.irpfPct?`<div><span>Retención IRPF (${f.irpfPct}%)</span><span>−${eur(f.irpfCuota)}</span></div>`:''}
      <div class="fx-total"><span>TOTAL</span><span>${eur(f.total)}</span></div>
    </div>
    ${em.iban?`<div class="fx-pay">Forma de pago — transferencia: ${esc(em.iban)}</div>`:''}

function verFactura(id){
  const f=(state.facturas||[]).find(x=>x.id===id); if(!f) return;
  const ov=document.getElementById('fac-overlay');
  ov.innerHTML=`<div class="fx-overlay"><div class="fx-actions"><button class="btn" onclick="descargarPDF('${f.id}')">Descargar PDF</button><button class="btn ghost" onclick="window.print()">Imprimir</button><button class="btn ghost" onclick="cerrarFactura()">Cerrar</button></div>
    <div class="fx-doc" id="fx-print">${facturaDocHTML(f)}</div></div>`;
  document.body.classList.add('printing');
}
function descargarPDF(id){
  var f=(state.facturas||[]).find(function(x){return x.id===id;}); if(!f) return;
  if(typeof html2pdf==='undefined'){ alert('Generador de PDF no disponible. Usa Imprimir y elige Guardar como PDF.'); return; }
  var wrap=document.createElement('div');
  wrap.style.position='fixed'; wrap.style.left='-9999px'; wrap.style.top='0';
  wrap.innerHTML='<div class="fx-doc" style="max-width:720px;background:#fff;color:#111">'+facturaDocHTML(f)+'</div>';
  document.body.appendChild(wrap);
  var nombre='Factura-'+String(f.numero||'borrador').replace(/\//g,'-')+'.pdf';
  html2pdf().set({margin:10,filename:nombre,image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(wrap.firstChild).save().then(function(){ try{document.body.removeChild(wrap);}catch(e){} }).catch(function(){ try{document.body.removeChild(wrap);}catch(e){} });
}
function cerrarFactura(){ const ov=document.getElementById('fac-overlay'); if(ov) ov.innerHTML=''; document.body.classList.remove('printing'); }
function provFacturas(){
  var map={}, groups={};
  (state.facturas||[]).forEach(function(f){ if(f.estado!=='emitida'){ var anio=(f.fecha||hoy()).slice(0,4); var key=f.tipo+'|'+anio; (groups[key]=groups[key]||[]).push(f); } });
  Object.keys(groups).forEach(function(key){ var anio=key.split('|')[1]; var base=(state.series&&state.series[key]!=null)?state.series[key]:0; groups[key].slice().sort(function(a,b){return (a.fecha||'').localeCompare(b.fecha||'');}).forEach(function(f,i){ map[f.id]=(base+i+1)+'/'+anio; }); });
  return map;
}
function facRow(f, prov){
  var emitida=f.estado==='emitida';
  var numero = emitida ? esc(f.numero) : `<span style="color:var(--muted)">${prov[f.id]||'—'} <span class="prov">(prov.)</span></span>`;
  var acc = (emitida?'':`<button class="btn sm" onclick="emitirFactura('${f.id}')">Emitir</button> `)+`<button class="btn ghost sm" onclick="verFactura('${f.id}')">Ver</button> <button class="btn ghost sm" onclick="descargarPDF('${f.id}')">PDF</button> <button class="del" onclick="delItem('facturas','${f.id}')">✕</button>`;
  return `<tr><td>${emitida?'':`<input type="checkbox" onchange="toggleSelFac('${f.id}',this.checked)" ${selFacturas[f.id]?'checked':''}>`}</td><td class="num"><b>${numero}</b></td><td class="num">${fFecha(f.fecha)}</td><td>${esc(f.clienteNombre||'—')}</td><td><span class="badge ${f.tipo==='nominativa'?'b-cyan':'b-gray'}">${f.tipo}</span></td><td><span class="badge ${emitida?'b-green':'b-gray'}">${emitida?'Emitida':'Borrador'}</span></td><td class="num" style="text-align:right">${eur(f.total)}</td><td style="text-align:right">${acc}</td></tr>`;
}
async function emitirFactura(id){
  var f=(state.facturas||[]).find(function(x){return x.id===id;}); if(!f||f.estado==='emitida') return;
  if(!confirm('¿Emitir esta factura? El número quedará fijado y ya no podrá cambiarse.')) return;
  var anio=parseInt((f.fecha||hoy()).slice(0,4),10);
  var r=await sb.rpc('next_factura_numero',{p_serie:f.tipo,p_anio:anio});
  if(r.error||!r.data){ alert('No se pudo emitir la factura.'); return; }
  f.numero=r.data; f.estado='emitida';
  if(!state.series) state.series={}; state.series[f.tipo+'|'+anio]=parseInt(String(r.data).split('/')[0],10);
  save(); render();
}
async function emitirTodos(){
  var draftsAll=(state.facturas||[]).filter(function(x){return x.estado!=='emitida';});
  if(!draftsAll.length){ alert('No hay borradores que emitir.'); return; }
  if(!confirm('¿Emitir los '+draftsAll.length+' borradores por orden de fecha de pago? Los números quedarán fijados.')) return;
  draftsAll.sort(function(a,b){return (a.fecha||'').localeCompare(b.fecha||'');});
  for(var i=0;i<draftsAll.length;i++){
    var f=draftsAll[i]; var anio=parseInt((f.fecha||hoy()).slice(0,4),10);
    var r=await sb.rpc('next_factura_numero',{p_serie:f.tipo,p_anio:anio});
    if(!r.error&&r.data){ f.numero=r.data; f.estado='emitida'; if(!state.series) state.series={}; state.series[f.tipo+'|'+anio]=parseInt(String(r.data).split('/')[0],10); }
  }
  save(); render();
}
async function generarFacturaDesdePago(mov){
  var em=state.emisor||{};
  if(!em.nombre||!em.nif) return null;
  var c=state.altas.find(function(x){return x.id===mov.cliente;})||{};
  var ivaPct=(em.ivaDefault!=null)?+em.ivaDefault:0;
  var tipo=em.tipoDefault||'auto'; if(tipo==='auto') tipo=c.nif?'nominativa':'simplificada';
  var total=+mov.importe;
  var base=ivaPct>0? total/(1+ivaPct/100) : total;
  var ivaCuota=total-base;
  var fac={id:uid(),numero:'',estado:'borrador',fecha:mov.fecha||hoy(),tipo:tipo,periodo:(mov.fecha||hoy()).slice(0,7),concepto:mov.concepto||'Servicio',clienteNombre:c.nombre||'',clienteNif:c.nif||'',clienteDir:c.direccion||'',base:+base.toFixed(2),ivaPct:ivaPct,ivaCuota:+ivaCuota.toFixed(2),irpfPct:0,irpfCuota:0,total:+total.toFixed(2),origen:mov.id};
  if(!state.facturas) state.facturas=[];
  state.facturas.push(fac); return fac;
}

function viewCRM(){
  const ETAPAS=[['nuevo','Nuevo'],['contactado','Contactado'],['agendado','Agendado'],['llamada','Llamada'],['ganado','Ganado'],['perdido','Perdido']];
  const eq=(state.equipo||[]);
  const leads=(state.leads||[]);
  const ganados=leads.filter(l=>l.etapa==='ganado').length;
  const perdidos=leads.filter(l=>l.etapa==='perdido').length;
  const conv=(ganados+perdidos)? Math.round(ganados/(ganados+perdidos)*100):0;
  const activos=leads.filter(l=>l.etapa!=='ganado'&&l.etapa!=='perdido');
  const valorPipe=activos.reduce((a,l)=>a+ +(l.valor||0),0);
  return `
  <div class="page-head"><div><div class="eyebrow">Captación</div><h1>CRM · Pipeline</h1>
  <p>Tus leads por etapa, desde que entran hasta que cierran. Muévelos de fase y conviértelos en cliente.</p></div>
  <button class="btn" onclick="toggleForm('l-form')">+ Lead</button></div>
  <div class="kpis">
    <div class="kpi"><div class="label">Leads activos</div><div class="val">${activos.length}</div><div class="sub">en el pipeline</div></div>
    <div class="kpi pos"><div class="label">% conversión</div><div class="val">${conv}%</div><div class="sub">${ganados} ganados · ${perdidos} perdidos</div></div>
    <div class="kpi"><div class="label">Valor en pipeline</div><div class="val mono">${eur(valorPipe)}</div><div class="sub">estimado, leads activos</div></div>
  </div>
  <div class="panel">
    <div class="form-grid hidden" id="l-form">
      <div class="field"><label>Nombre</label><input id="l-nombre" placeholder="Nombre del lead"></div>
      <div class="field"><label>Email</label><input id="l-email"></div>
      <div class="field"><label>Teléfono</label><input id="l-tel"></div>
      <div class="field"><label>Fuente</label><select id="l-fuente"><option value="">—</option><option>Instagram</option><option>Facebook Ads</option><option>Referido</option><option>Web</option><option>Otro</option></select></div>
      <div class="field"><label>Tipo</label><select id="l-tipo"><option value="">—</option><option>Futbolista - LCA</option><option>Futbolista - Pubalgia</option><option>Futbolista - Otra lesión</option><option>Futbolista - Rendimiento</option><option>Otro deporte</option></select></div>
      <div class="field"><label>Valor estimado (€)</label><input type="number" id="l-valor" step="0.01" placeholder="0,00"></div>
      <div class="field"><label>Asignado a</label><select id="l-asig"><option value="">—</option>${eq.map(m=>`<option value="${m.id}">${esc(m.nombre)}</option>`).join('')}</select></div>
      <div class="field full"><label>Notas</label><input id="l-notas"></div>
      <div class="form-actions"><button class="btn ghost sm" onclick="toggleForm('l-form')">Cancelar</button><button class="btn sm" onclick="addLead()">Guardar</button></div>
    </div>
    <div class="panel-body">
      ${ETAPAS.map(function(et){ var ls=leads.filter(function(l){return (l.etapa||'nuevo')===et[0];}); if(!ls.length&&(et[0]==='ganado'||et[0]==='perdido')) return ''; return `<div class="crm-stage"><div class="crm-stage-h">${et[1]} <span>${ls.length}</span></div>${ls.length?ls.map(l=>leadCard(l)).join(''):'<div class="noday" style="padding:6px 20px">—</div>'}</div>`; }).join('')}
    </div>
  </div>`;
}
function leadCard(l){
  var E=[['nuevo','Nuevo'],['contactado','Contactado'],['agendado','Agendado'],['llamada','Llamada'],['ganado','Ganado'],['perdido','Perdido']];
  var opts=E.map(function(e){return '<option value="'+e[0]+'"'+((l.etapa||'nuevo')===e[0]?' selected':'')+'>'+e[1]+'</option>';}).join('');
  return `<div class="crm-card"><div class="crm-main"><b>${esc(l.nombre)}</b>${l.fuente?` <span class="badge b-gray">${esc(l.fuente)}</span>`:''}${l.valor?` <span class="crm-val">${eur(l.valor)}</span>`:''}${l.asignado?`<span class="who">${esc(miembroNombre(l.asignado))}</span>`:''}</div><div class="crm-actions"><select onchange="moverLead('${l.id}',this.value)">${opts}</select>${l.etapa==='ganado'?`<button class="btn sm" onclick="convertirLead('${l.id}')">A cliente</button>`:''}<button class="del" onclick="delItem('leads','${l.id}')">✕</button></div></div>`;
}
function addLead(){
  var nombre=val('l-nombre'); if(!nombre){ alert('Indica el nombre del lead.'); return; }
  if(!state.leads) state.leads=[];
  state.leads.push({id:uid(),nombre:nombre,email:val('l-email'),telefono:val('l-tel'),fuente:document.getElementById('l-fuente').value,tipo:document.getElementById('l-tipo').value,valor:parseFloat(document.getElementById('l-valor').value)||0,asignado:document.getElementById('l-asig').value,notas:val('l-notas'),etapa:'nuevo'});
  toggleForm('l-form'); save(); render();
}
function moverLead(id,etapa){ var l=(state.leads||[]).find(function(x){return x.id===id;}); if(l){ l.etapa=etapa; save(); render(); } }
function convertirLead(id){
  var l=(state.leads||[]).find(function(x){return x.id===id;}); if(!l) return;
  if(!confirm('¿Convertir "'+l.nombre+'" en cliente (Alta)?')) return;
  if(!state.altas) state.altas=[];
  state.altas.push({id:uid(),nombre:l.nombre,deporte:'',lesion:'',entrenador:'',fechaAlta:hoy(),tarifa:l.valor||0,estado:'activo',nif:'',direccion:'',email:l.email||'',tipoCliente:l.tipo||'',diaCobro:null,fechaVencimiento:null,ultimoContacto:hoy()});
  save(); render(); alert('Convertido a cliente. Revisa su ficha en Altas.');
}

function viewDatos(){
  const n=state;
  return `
  <div class="page-head"><div><div class="eyebrow">Copia de seguridad</div><h1>Datos</h1>
  <p>Tus datos se guardan en este dispositivo. Para pasarlos entre el móvil y el portátil —o para no perderlos nunca— usa la copia de seguridad.</p></div></div>
  <div class="kpis">
    <div class="kpi"><div class="label">Movimientos</div><div class="val">${n.finanzas.length}</div></div>
    <div class="kpi"><div class="label">Altas</div><div class="val">${n.altas.length}</div></div>
    <div class="kpi"><div class="label">Videollamadas</div><div class="val">${n.videollamadas.length}</div></div>
    <div class="kpi"><div class="label">Eventos</div><div class="val">${n.eventos.length}</div></div>
    <div class="kpi"><div class="label">Tareas</div><div class="val">${(n.tareas||[]).length}</div></div>
    <div class="kpi"><div class="label">Equipo</div><div class="val">${(n.equipo||[]).length}</div></div>
    <div class="kpi"><div class="label">Facturas</div><div class="val">${(n.facturas||[]).length}</div></div>
  </div>
  <div class="panel"><div class="panel-head"><h3>Exportar / importar</h3></div>
    <div class="panel-body" style="padding:20px;display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn" onclick="exportarBackup()">↓ Exportar copia (.json)</button>
      <button class="btn ghost" onclick="document.getElementById('imp').click()">↑ Importar copia</button>
      <input type="file" id="imp" accept="application/json,.json" style="display:none" onchange="importarBackup(this)">
    </div>
  </div>
  <div class="panel"><div class="panel-head"><h3>Cómo usarlo entre móvil y portátil</h3></div>
    <div style="padding:16px 20px"><div class="info">
      Como cada dispositivo guarda por su cuenta, elige un flujo y sé constante:
      <ol>
        <li><b>Trabaja siempre en un equipo "principal"</b> (p. ej. el portátil).</li>
        <li>Al terminar, pulsa <b>Exportar copia</b> y guarda el archivo en tu Drive o iCloud.</li>
        <li>En el otro dispositivo, abre ese archivo y pulsa <b>Importar copia</b> para ponerlo al día.</li>
        <li>Evita editar en los dos a la vez: la última importación <b>reemplaza</b> lo anterior.</li>
      </ol>
      Cuando este baile se te haga pesado, es la señal de dar el salto a la versión en la nube.
    </div></div>
  </div>`;
}
function exportarBackup(){ bajarArchivo('bfh-backup-'+hoy()+'.json', JSON.stringify(state,null,2), 'application/json'); }
function importarBackup(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data||typeof data!=='object') throw 0;
      if(!confirm('Esto reemplazará los datos actuales de este dispositivo por los de la copia. ¿Continuar?')){ input.value=''; return; }
      state={ finanzas:data.finanzas||[], altas:data.altas||[], videollamadas:data.videollamadas||[], eventos:data.eventos||[], tareas:data.tareas||[], tareaCats:data.tareaCats||[], equipo:data.equipo||[], emisor:data.emisor||{}, facturas:data.facturas||[], leads:data.leads||[] };
      save(); render(); alert('Copia importada correctamente.');
    }catch(e){ alert('El archivo no es una copia válida del panel.'); }
    input.value='';
  };
  reader.readAsText(file);
}

function delItem(coll,id){ if(!confirm('¿Eliminar este registro?')) return; state[coll]=state[coll].filter(x=>x.id!==id); dbDelete(coll,id); save(); render(); }
function toggleForm(id){ const el=document.getElementById(id); if(el) el.classList.toggle('hidden'); }
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); tab=b.dataset.tab; render(); window.scrollTo(0,0);
}));
async function doLogin(){
  var email=(document.getElementById('lg-email').value||'').trim();
  var pass=document.getElementById('lg-pass').value||'';
  var err=document.getElementById('lg-err'); err.textContent='Entrando…';
  var res=await sb.auth.signInWithPassword({email:email,password:pass});
  if(res.error){ err.textContent='No se pudo entrar: '+res.error.message; return; }
  await entrar();
}
async function entrar(){
  var g=document.getElementById('login-gate'); if(g) g.style.display='none';
  await loadAll(); render();
  var s=document.getElementById('storeState'); if(s){ s.textContent='nube · Supabase'; s.style.color='var(--accent)'; }
}
async function logout(){ try{ await sb.auth.signOut(); }catch(e){} location.reload(); }
async function initApp(){
  try{ var res=await sb.auth.getSession(); if(res.data&&res.data.session){ await entrar(); return; } }catch(e){ console.error(e); }
  var g=document.getElementById('login-gate'); if(g) g.style.display='flex';
}
initApp();
</script>
