<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrato y pago · Built From Health</title>
<style>
  :root{ --bg:#f4f6fa; --card:#fff; --text:#222222; --muted:#5b6672; --line:#e3e7ec; --accent:#00b2ff; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.5;padding:20px 14px 60px}
  .wrap{max-width:560px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-bottom:16px}
  .head{text-align:center;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
  .head h1{font-size:19px;font-weight:700}
  .head p{font-size:13px;color:var(--muted);margin-top:3px}
  .plan{background:#E6F1FB;border-radius:10px;padding:12px 14px;font-size:14px;color:#0C447C;margin-bottom:20px}
  .plan b{font-weight:700}
  h2{font-size:14px;font-weight:700;margin:18px 0 8px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 11px;font-size:15px;color:var(--text);background:#fff}
  input:focus{outline:none;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .contract{border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-height:260px;overflow-y:auto;font-size:12.5px;color:#3a434e;line-height:1.55}
  .contract h3{font-size:13px;color:var(--text);margin:12px 0 4px}
  .contract h3:first-child{margin-top:0}
  .contract ul{margin:4px 0 4px 18px}
  .chk{display:flex;align-items:flex-start;gap:10px;margin-top:12px;font-size:13.5px;cursor:pointer}
  .chk input{width:20px;height:20px;flex-shrink:0;margin-top:1px;accent-color:var(--accent)}
  .req{color:#e24b4a}
  .vercon{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--accent);font-size:14px;font-weight:700;cursor:pointer;margin-bottom:4px}
  .pay{width:100%;height:48px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px}
  .pay:disabled{opacity:.6;cursor:default}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:10px}
  .err{background:#FCEBEB;color:#a32d2d;border-radius:9px;padding:10px 12px;font-size:13px;margin-top:14px;display:none}
  .state{text-align:center;padding:40px 10px}
  .state .big{font-size:40px;margin-bottom:10px}
  .state h1{font-size:20px;margin-bottom:8px}
  .state p{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="root">
    <div class="state"><p>Cargando…</p></div>
  </div>
</div>

<script>
var SB_URL='https://vxxhkuizeceutbowxcmq.supabase.co';
var SB_KEY='sb_publishable_czwCWuPJQYKiZzvHRaQlVQ_Z9EsbAP3';
var FN=SB_URL+'/functions/v1/';
function H(){ return {'Content-Type':'application/json','Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY}; }
function qp(k){ return new URLSearchParams(location.search).get(k); }
var CID=qp('c');
var root=document.getElementById('root');

function esc(s){ return (s||'').replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
function eur(n){ return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n||0); }

function contratoHTML(){
  return '<h3>1. Partes</h3>Acuerdo entre <b>Fabián García Taibo</b>, fisioterapeuta colegiado del Colexio Oficial de Fisioterapeutas de Galicia (CoFiGa) nº 4710, DNI 79341626K (EL PROFESIONAL), y el cliente que completa este formulario (EL CLIENTE).'
  +'<h3>2. Objeto</h3>Programa de fisioterapia y rendimiento online 1:1 enfocado en la rehabilitación y prevención de lesiones en futbolistas, con el objetivo de devolver al jugador a la competición, prevenir lesiones futuras y mejorar su rendimiento.'
  +'<h3>3. Descripción</h3>Incluye: evaluación inicial (anamnesis y análisis funcional), plan individualizado, seguimiento continuo cada 1–2 días por WhatsApp, feedback y ajustes semanales, videollamadas de control cuando sean necesarias e informe final de funcionalidad. Duración: 3, 6 o 9 meses.'
  +'<h3>4. Naturaleza</h3>EL CLIENTE entiende que el servicio es 100% online, sin supervisión presencial directa, que no sustituye atención médica ni fisioterapia presencial y que no incluye diagnóstico médico ni alta deportiva.'
  +'<h3>5. Riesgos y limitaciones</h3>Puede experimentar dolor, fatiga o molestias derivadas del ejercicio; la correcta ejecución depende de su responsabilidad; los resultados dependen de su adherencia e implicación; los tiempos de vuelta al deporte son aproximados y no están garantizados. El profesional podrá derivar a un médico si es necesario.'
  +'<h3>6. Contraindicaciones</h3>El cliente declara no presentar condiciones que contraindiquen el ejercicio físico, o haberlas informado previamente.'
  +'<h3>7. Responsabilidades</h3>EL CLIENTE se compromete a mantener criterio seguro, adaptar ejercicios ante imprevistos, acudir al médico ante síntomas graves, y cumplir con el programa y los pagos acordados. EL PROFESIONAL adaptará el programa, mantendrá confidencialidad, actuará en el ámbito online, entregará informes cuando se soliciten y emitirá las facturas legales. El profesional no será responsable de lesiones por mala ejecución, incumplimiento del programa o información omitida.'
  +'<h3>8. Alta deportiva</h3>El fisioterapeuta no otorga el alta deportiva; emite un informe de funcionalidad. La decisión final corresponde al médico y al propio cliente.'
  +'<h3>9. Tarifas y pago</h3>Modalidad de 3, 6 o 9 meses, con pago único o fraccionado mediante Stripe, Hotmart o transferencia. El impago podrá suponer la suspensión o cancelación del servicio.'
  +'<h3>10. Devoluciones</h3>Devolución íntegra dentro de los primeros 15 días desde el pago; entre el día 15 y el 30, el 50%; a partir del día 30 no se realizan devoluciones. No se devuelve por falta de resultados ni abandono voluntario.'
  +'<h3>11. Protección de datos</h3>Los datos se tratan conforme al RGPD/LOPDGDD, para seguimiento clínico, informes internos y, con consulta previa, fines educativos o divulgativos (incluida @fles.sportsrehab). Derecho de acceso, rectificación y eliminación.'
  +'<h3>12. Imágenes</h3>Las imágenes o vídeos podrán usarse con fines clínicos y educativos. El cliente puede aceptar o rechazar su uso y revocar el consentimiento en cualquier momento.'
  +'<h3>13. Legislación</h3>Acuerdo regido por la legislación española; conflictos sometidos a los tribunales del domicilio profesional del fisioterapeuta.';
}

function render(ct){
  var frac = ct.modo_pago==='fraccionado';
  var importeTxt = frac ? (eur(ct.importe)+' /mes durante '+ct.duracion_meses+' meses') : (eur(ct.importe)+' (pago único)');
  var btnTxt = frac ? ('Aceptar y pagar 1ª cuota · '+eur(ct.importe)) : ('Aceptar y pagar '+eur(ct.importe));
  var hoy = new Date().toLocaleDateString('es-ES');
  root.innerHTML =
    '<div class="head"><h1>Built From Health</h1><p>Contrato de prestación de servicios</p></div>'
    +'<div class="plan"><b>'+esc(ct.tipo_servicio)+'</b> · '+ct.duracion_meses+' meses · '+importeTxt+'</div>'
    +'<h2>Tus datos</h2>'
    +'<label>Nombre y apellidos *</label><input id="f-nombre">'
    +'<div class="grid"><div><label>DNI / pasaporte *</label><input id="f-dni"></div><div><label>Teléfono *</label><input id="f-tel"></div></div>'
    +'<label>Lugar de residencia *</label><input id="f-res">'
    +'<div class="grid"><div><label>Email *</label><input id="f-email" type="email"></div><div><label>Fecha de nacimiento *</label><input id="f-nac" type="date"></div></div>'
    +'<h2>El contrato</h2><button type="button" class="vercon" id="vercon" onclick="toggleContrato()">Ver el contrato completo ▾</button><div class="contract" id="contract" style="display:none">'+contratoHTML()+'</div>'
    +'<label class="chk"><input type="checkbox" id="a-contrato"><span>He leído y acepto el <b>contrato completo</b> <span class="req">*</span></span></label>'
    +'<label class="chk"><input type="checkbox" id="a-consent"><span>Acepto el <b>consentimiento informado</b> <span class="req">*</span></span></label>'
    +'<label class="chk"><input type="checkbox" id="a-datos"><span>Acepto el <b>tratamiento de datos</b> conforme al RGPD <span class="req">*</span></span></label>'
    +'<label class="chk"><input type="checkbox" id="a-img"><span>Autorizo el uso de imágenes y vídeos con fines de promoción durante el programa (opcional, revocable)</span></label>'
    +'<h2>Firma</h2><p style="font-size:12px;color:var(--muted);margin-bottom:6px">Esta aceptación tiene validez legal equivalente a una firma manuscrita.</p>'
    +'<label>Nombre y apellidos *</label><input id="f-firma">'
    +'<div style="font-size:12px;color:var(--muted);margin-top:8px">Fecha: '+hoy+'</div>'
    +'<div class="err" id="err"></div>'
    +'<button class="pay" id="pay" onclick="pagar()"><span>'+btnTxt+'</span></button>'
    +'<div class="foot">Pago seguro con Stripe · El cobro va a Built From Health</div>';
}

function toggleContrato(){ var c=document.getElementById('contract'); var b=document.getElementById('vercon'); if(!c)return; var abierto=c.style.display!=='none'; c.style.display=abierto?'none':'block'; b.textContent=abierto?'Ver el contrato completo ▾':'Ocultar el contrato ▴'; }
function showErr(m){ var e=document.getElementById('err'); if(e){ e.textContent=m; e.style.display='block'; e.scrollIntoView({behavior:'smooth',block:'center'}); } }

async function pagar(){
  function V(x){ var e=document.getElementById(x); return e?e.value.trim():''; }
  var e=document.getElementById('err'); if(e) e.style.display='none';
  var faltan=[]; if(!V('f-nombre'))faltan.push('nombre'); if(!V('f-dni'))faltan.push('DNI'); if(!V('f-res'))faltan.push('residencia'); if(!V('f-email'))faltan.push('email'); if(!V('f-tel'))faltan.push('teléfono'); if(!V('f-nac'))faltan.push('fecha de nacimiento'); if(!V('f-firma'))faltan.push('firma'); if(faltan.length){ showErr('Faltan datos obligatorios: '+faltan.join(', ')+'.'); return; }
  if(!document.getElementById('a-contrato').checked || !document.getElementById('a-consent').checked || !document.getElementById('a-datos').checked){
    showErr('Debes marcar las tres aceptaciones obligatorias.'); return;
  }
  var btn=document.getElementById('pay'); btn.disabled=true; btn.querySelector('span').textContent='Redirigiendo al pago…';
  try{
    var payload={ c:CID, nombre:V('f-firma')||V('f-nombre'), dni:V('f-dni'), residencia:V('f-res'), email:V('f-email'),
      telefono:V('f-tel'), fecha_nac:V('f-nac'),
      acepta_contrato:true, acepta_consentimiento:true, acepta_datos:true, acepta_imagenes:document.getElementById('a-img').checked,
      origin:location.origin };
    var r=await fetch(FN+'aceptar-contrato',{method:'POST',headers:H(),body:JSON.stringify(payload)});
    var d=await r.json();
    if(!d.ok) throw new Error(d.error||'No se pudo procesar.');
    location.href=d.url;
  }catch(err){ btn.disabled=false; btn.querySelector('span').textContent='Reintentar pago'; showErr('No se pudo procesar: '+(err.message||err)); }
}

function gracias(){
  root.innerHTML='<div class="state"><div class="big">✓</div><h1>¡Pago recibido!</h1><p>Gracias. Tu contrato ha quedado registrado y nos pondremos en contacto contigo para empezar.</p></div>';
}
function cancelado(){ showErr('El pago se canceló. Puedes volver a intentarlo cuando quieras.'); }

(async function(){
  if(qp('ok')){ gracias(); return; }
  if(!CID){ root.innerHTML='<div class="state"><h1>Enlace no válido</h1><p>Falta el identificador del contrato.</p></div>'; return; }
  try{
    var r=await fetch(FN+'get-contrato?c='+encodeURIComponent(CID),{headers:H()});
    var d=await r.json();
    if(!d.ok) throw new Error(d.error||'No encontrado');
    if(d.contrato.estado==='pagado'){ gracias(); return; }
    render(d.contrato);
    if(qp('cancel')) cancelado();
  }catch(err){ root.innerHTML='<div class="state"><h1>No se pudo cargar</h1><p>'+esc(err.message||String(err))+'</p></div>'; }
})();
</script>
</body>
</html>
