<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrato y pago · Built From Health</title>
<style>
  :root{ --bg:#f4f6fa; --card:#fff; --text:#222222; --muted:#5b6672; --line:#e3e7ec; --accent:#00b2ff; --ink:#15181d; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.5;padding:0 0 60px}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .brand{background:var(--ink);text-align:center;padding:22px 0 18px;margin-bottom:0}
  .brand img{width:120px;height:auto;display:inline-block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-top:16px}
  .sub{text-align:center;font-size:13px;color:var(--muted);margin:14px 0 4px}
  .plan{background:#E6F1FB;border-radius:10px;padding:13px 15px;font-size:14px;color:#0C447C;margin-bottom:20px}
  .plan b{font-weight:700;display:block;margin-bottom:3px}
  h2{font-size:14px;font-weight:700;margin:18px 0 8px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 11px;font-size:15px;color:var(--text);background:#fff}
  input:focus{outline:none;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chk{display:flex;align-items:flex-start;gap:10px;margin-top:12px;font-size:13.5px;cursor:pointer}
  .chk input{width:20px;height:20px;flex-shrink:0;margin-top:1px;accent-color:var(--accent)}
  .chk a{color:var(--accent);font-weight:600}
  .req{color:#e24b4a}
  .pay{width:100%;height:48px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px}
  .pay:disabled{opacity:.6;cursor:default}
  .note{font-size:12px;color:var(--muted);margin-top:14px}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:10px}
  .err{background:#FCEBEB;color:#a32d2d;border-radius:9px;padding:10px 12px;font-size:13px;margin-top:14px;display:none}
  .state{text-align:center;padding:40px 10px}
  .state .big{font-size:40px;margin-bottom:10px;color:#1fa971}
  .state h1{font-size:20px;margin-bottom:8px}
  .state p{color:var(--muted);font-size:14px}
</style>
</head>

<div class="wrap">
  <div class="card" id="root"><div class="state"><p>Cargando…</p></div></div>
</div>
<script>
var SB_URL='https://vxxhkuizeceutbowxcmq.supabase.co';
var SB_KEY='sb_publishable_czwCWuPJQYKiZzvHRaQlVQ_Z9EsbAP3';
var FN=SB_URL+'/functions/v1/';
var PROGRAMA='Built From Health · Servicio 1a1 de recuperación y rendimiento de deportistas';
function H(){ return {'Content-Type':'application/json','Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY}; }
function qp(k){ return new URLSearchParams(location.search).get(k); }
var CID=qp('c');
var root=document.getElementById('root');
function esc(s){ return (s||'').replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
function eur(n){ return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n||0); }

function render(ct){
  var frac = ct.modo_pago==='fraccionado';
  var transfer = ct.metodo==='transferencia';
  var importeTxt = transfer ? (eur(ct.importe)+' (por transferencia)') : (frac ? (eur(ct.importe)+' /mes durante '+ct.duracion_meses+' meses') : (eur(ct.importe)+' (pago único)'));
  var btnTxt = transfer ? 'Aceptar contrato' : (frac ? ('Aceptar y pagar 1ª cuota · '+eur(ct.importe)) : ('Aceptar y pagar '+eur(ct.importe)));
  root.innerHTML =
    '<div class="sub">Contrato de prestación de servicios</div>'
    +'<div class="plan"><b>'+esc(PROGRAMA)+'</b>'+esc(ct.tipo_servicio)+' · '+ct.duracion_meses+' meses · '+importeTxt+'</div>'
    +'<h2>Tus datos</h2>'
    +'<label>Nombre y apellidos *</label><input id="f-nombre">'
    +'<div class="grid"><div><label>DNI / pasaporte *</label><input id="f-dni"></div><div><label>Teléfono *</label><input id="f-tel"></div></div>'
    +'<label>Lugar de residencia *</label><input id="f-res">'
    +'<div class="grid"><div><label>Email *</label><input id="f-email" type="email"></div><div><label>Fecha de nacimiento *</label><input id="f-nac" type="date"></div></div>'
    +'<h2>Aceptación</h2>'
    +'<label class="chk"><input type="checkbox" id="a-contrato"><span>He leído y acepto los <a href="terminos.html" target="_blank" rel="noopener">términos y condiciones del servicio</a> <span class="req">*</span></span></label>'
    +'<label class="chk"><input type="checkbox" id="a-consent"><span>Acepto el <b>consentimiento informado</b> <span class="req">*</span></span></label>'
    +'<label class="chk"><input type="checkbox" id="a-datos"><span>Acepto el <b>tratamiento de datos</b> conforme al RGPD <span class="req">*</span></span></label>'
    +'<label class="chk"><input type="checkbox" id="a-img"><span>Autorizo el uso de imágenes y vídeos con fines de promoción durante el programa (opcional, revocable)</span></label>'
    +'<p class="note">Al marcar las casillas y pagar, tu aceptación queda registrada con validez legal equivalente a una firma manuscrita.</p>'
    +'<div class="err" id="err"></div>'
    +'<button class="pay" id="pay" onclick="pagar()"><span>'+btnTxt+'</span></button>'
    +'<div class="foot">'+(transfer?'Tras aceptar, te mostramos el IBAN para la transferencia':'Pago seguro con Stripe · El cobro va a Built From Health')+'</div>';
}
function showErr(m){ var e=document.getElementById('err'); if(e){ e.textContent=m; e.style.display='block'; e.scrollIntoView({behavior:'smooth',block:'center'}); } }
async function pagar(){
  function V(x){ var e=document.getElementById(x); return e?e.value.trim():''; }
  var e=document.getElementById('err'); if(e) e.style.display='none';
  var faltan=[]; if(!V('f-nombre'))faltan.push('nombre'); if(!V('f-dni'))faltan.push('DNI'); if(!V('f-res'))faltan.push('residencia'); if(!V('f-email'))faltan.push('email'); if(!V('f-tel'))faltan.push('teléfono'); if(!V('f-nac'))faltan.push('fecha de nacimiento');
  if(faltan.length){ showErr('Faltan datos obligatorios: '+faltan.join(', ')+'.'); return; }
  if(!document.getElementById('a-contrato').checked || !document.getElementById('a-consent').checked || !document.getElementById('a-datos').checked){ showErr('Debes marcar las tres aceptaciones obligatorias.'); return; }
  var btn=document.getElementById('pay'); btn.disabled=true; btn.querySelector('span').textContent='Procesando…';
  try{
    var payload={ c:CID, nombre:V('f-nombre'), dni:V('f-dni'), residencia:V('f-res'), email:V('f-email'), telefono:V('f-tel'), fecha_nac:V('f-nac'),
      acepta_contrato:true, acepta_consentimiento:true, acepta_datos:true, acepta_imagenes:document.getElementById('a-img').checked, origin:location.origin };
    var r=await fetch(FN+'aceptar-contrato',{method:'POST',headers:H(),body:JSON.stringify(payload)});
    var d=await r.json();
    if(!d.ok) throw new Error(d.error||'No se pudo procesar.');
    if(d.transferencia){ graciasTransferencia(d.iban, d.importe); return; }
    location.href=d.url;
  }catch(err){ btn.disabled=false; btn.querySelector('span').textContent='Reintentar pago'; showErr('No se pudo procesar: '+(err.message||err)); }
}
function gracias(){ root.innerHTML='<div class="state"><div class="big">✓</div><h1>¡Pago recibido!</h1><p>Gracias. Tu contrato ha quedado registrado y nos pondremos en contacto contigo para empezar.</p></div>'; }
function copiarIban(iban){ try{ navigator.clipboard.writeText(iban); }catch(e){ var t=document.createElement('textarea'); t.value=iban; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(_){} document.body.removeChild(t); } var b=document.getElementById('cpib'); if(b){ b.textContent='Copiado ✓'; setTimeout(function(){ b.textContent='Copiar IBAN'; },1800); } }
function graciasTransferencia(iban, importe){
  root.innerHTML='<div class="state"><div class="big">✓</div><h1>¡Contrato aceptado!</h1>'
    +'<p>Para completarlo, realiza una transferencia de <b>'+eur(importe)+'</b> a este IBAN:</p>'
    +'<div style="background:#f3f6fa;border:1px solid var(--line);border-radius:10px;padding:14px;margin:16px auto;max-width:420px">'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:4px">IBAN · Built From Health</div>'
    +'<div style="font-size:17px;font-weight:700;letter-spacing:.5px;word-break:break-all">'+esc(iban||'')+'</div>'
    +'<button id="cpib" onclick="copiarIban(\''+esc(iban||'')+'\')" style="margin-top:12px;height:40px;padding:0 18px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer">Copiar IBAN</button></div>'
    +'<p style="font-size:13px;color:var(--muted)">Pon tu nombre en el concepto. En cuanto recibamos la transferencia nos pondremos en contacto para empezar.</p></div>';
}
(async function(){
  if(qp('ok')){ gracias(); return; }
  if(!CID){ root.innerHTML='<div class="state"><h1>Enlace no válido</h1><p>Falta el identificador del contrato.</p></div>'; return; }
  try{
    var r=await fetch(FN+'get-contrato?c='+encodeURIComponent(CID),{headers:H()});
    var d=await r.json();
    if(!d.ok) throw new Error(d.error||'No encontrado');
    if(d.contrato.estado==='pagado'){ gracias(); return; }
    render(d.contrato);
    if(qp('cancel')) showErr('El pago se canceló. Puedes volver a intentarlo cuando quieras.');
  }catch(err){ root.innerHTML='<div class="state"><h1>No se pudo cargar</h1><p>'+esc(err.message||String(err))+'</p></div>'; }
})();
</script>
