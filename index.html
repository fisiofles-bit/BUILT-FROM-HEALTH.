<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Built From Health · Panel</title>
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" type="image/png" href="/icon.png">
<meta name="theme-color" content="#10141A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BFH Panel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
:root{
  color-scheme:dark;
  --ink:#080b10;           /* barra lateral */
  --bg:#0a0e16;            /* fondo azul oscuro */
  --surface:#171B22;
  --surface-2:#1E232B;
  --text:#E7EAED;
  --muted:#8A94A0;
  --line:#272D35;
  --accent:#00B2FF;
  --accent-press:#33C1FF;
  --accent-tint:rgba(0,178,255,.15);
  --on-accent:#04222E;
  --red-text:#FF3547;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.42);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1100px 640px at 82% -12%, #14181F 0%, var(--bg) 58%) fixed}
body{font-family:'Poppins','Inter',system-ui,sans-serif;background:radial-gradient(1000px 560px at 80% -14%, rgba(0,150,255,.16), transparent 62%), var(--bg);background-attachment:fixed;color:var(--text);-webkit-font-smoothing:antialiased;display:flex;height:100vh;overflow:hidden}
.mono{font-family:'Space Mono',monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}

/* ---------- Sidebar vertical ---------- */
.sidebar{width:236px;flex-shrink:0;background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:22px 14px;gap:4px;position:relative;height:100vh;overflow-y:auto;border-right:1px solid #223042;box-shadow:2px 0 16px rgba(0,0,0,.55)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.brand .logo{width:60px;height:60px;flex-shrink:0;object-fit:contain}
.brand .wordmark{height:36px;width:auto;display:block}
.brandtxt b{font-family:'Space Grotesk';font-weight:700;font-size:15px;line-height:1.1;display:block;text-transform:uppercase;letter-spacing:.04em}
.brandtxt span{font-size:10px;color:#9AA6B0;letter-spacing:.16em;text-transform:uppercase;display:block;margin-top:3px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;border:0;cursor:pointer;background:transparent;color:#AEB8C0;font:inherit;font-size:14px;font-weight:500;padding:11px 12px;border-radius:10px;text-align:left;transition:.15s;position:relative}
.nav-btn svg{width:18px;height:18px;flex-shrink:0}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-btn.active{background:var(--accent);color:var(--on-accent);font-weight:600}
.nav-btn.active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);border-left:6px solid var(--accent);border-top:5px solid transparent;border-bottom:5px solid transparent}
.side-foot{margin-top:auto;font-size:11px;color:#7A858E;padding:12px 8px 0;line-height:1.5;border-top:1px solid rgba(255,255,255,.08)}
#storeState{color:var(--accent)}

/* ---------- Main ---------- */
.main-scroll{flex:1;min-width:0;height:100vh;overflow-y:auto}
.main{min-width:0;padding:6px 34px 60px;max-width:none}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.page-head .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.page-head h1{font-size:30px;font-weight:700;margin-top:4px}
.page-head p{color:var(--muted);font-size:14px;margin-top:6px;max-width:560px;line-height:1.5}
.btn{border:0;cursor:pointer;font:inherit;font-weight:600;font-size:14px;padding:10px 16px;border-radius:10px;background:var(--accent);color:var(--on-accent);transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--accent-press)}
.btn.ghost{background:#1B1F24;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:7px 12px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:28px}
.kpi{background:rgba(20,27,38,.9);border:1.5px solid rgba(255,255,255,.16);border-radius:18px;padding:18px 20px;box-shadow:0 14px 36px rgba(0,0,0,.40)}
.kpi .label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi .val{font-family:'Poppins','Space Grotesk';font-weight:700;font-size:30px;margin-top:8px;line-height:1}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:7px}
.kpi.pos .val{color:var(--accent-press)}
.kpi.neg .val{color:var(--red-text)}
.panel{background:rgba(20,27,38,.9);border:1.5px solid rgba(255,255,255,.16);border-radius:18px;box-shadow:0 14px 36px rgba(0,0,0,.45);overflow:hidden;margin-bottom:22px}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:18px;font-weight:700;font-family:'Poppins',sans-serif}
h1,h2,.brand{font-family:'Poppins',sans-serif;font-weight:700}
.page-head h1{font-size:30px}
.panel-body{padding:6px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:12px 20px;border-bottom:1px solid var(--line)}
td{padding:13px 20px;border-bottom:1px solid var(--line);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:#1D232B}
.num{font-family:'Space Mono',monospace;font-variant-numeric:tabular-nums}
.pos{color:var(--accent-press)}
.neg{color:var(--red-text)}
.del{background:transparent;border:0;cursor:pointer;color:var(--muted);padding:5px;border-radius:6px}
.del:hover{color:var(--red-text);background:rgba(226,59,78,.15)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--text);font-family:'Space Grotesk';margin-bottom:5px;font-size:16px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
.b-cyan{background:rgba(0,178,255,.16);color:#7FD6FF}
.b-amber{background:rgba(232,147,12,.18);color:#F59E0B}
.b-red{background:rgba(226,59,78,.18);color:#FF3547}
.b-impago{background:rgba(255,40,58,.22);color:#FF2E3A;font-weight:700}
.b-gasto{background:rgba(249,115,22,.2);color:#F97316;font-weight:600}
.b-ink{background:#24282E;color:#C6CDD5}
.b-gray{background:#22262B;color:#8A94A0}
.b-green{background:rgba(52,211,153,.16);color:#22D07B}
.ev-venc.urg{background:rgba(232,147,12,.22);color:#F59E0B}
.b-abanca{background:rgba(37,99,235,.18);color:#7FB0FF}
.b-stripe{background:rgba(124,92,255,.20);color:#9B7BF0}
.b-hotmart{background:rgba(226,59,78,.16);color:#FF3547}
.b-venta{background:rgba(226,59,78,.18);color:#FF3547}
.b-inicial{background:rgba(232,147,12,.20);color:#F59E0B}
.b-control{background:rgba(52,211,153,.16);color:#22D07B}
.doc-cat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.doc-cat-h{font-weight:600;font-size:13px;margin-bottom:6px}
.doc-list{list-style:none;margin:0 0 8px;padding:0}
.doc-list li{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.doc-list li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inl{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:3px 5px;font:inherit;font-size:12px}
.inl:focus{outline:1px solid #33C1FF}
.avisos-det>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.avisos-det>summary::-webkit-details-marker{display:none}
.avisos-det>summary::after{content:'▸';margin-left:auto;color:var(--muted);font-size:12px}
.avisos-det[open]>summary::after{content:'▾'}
.ev-chip.ev-tarea{color:#EAF0F5}
.ev-chip.ev-vid{background:#141A28;color:#fff}
.bfh-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1C2230;border:1px solid var(--line);color:#EAF0F5;padding:10px 14px;border-radius:10px;display:none;align-items:center;gap:12px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:13px;max-width:92vw}
.bfh-toast.err{border-color:#E23B4E;background:#2A1720}
.bfh-toast button{background:#33C1FF;color:#04121A;border:0;border-radius:6px;padding:5px 10px;font:inherit;font-weight:700;cursor:pointer}
.avisos-det.prio{border:2px solid #E23B4E}
.avisos-det.prio>summary h3{color:#FF3547;font-size:20px}
.avisos-det.secu{border:2px solid #E8930C}
.avisos-det.secu>summary h3{color:#F59E0B;font-size:18px}
.urg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.urg-alta{background:#FF3547}
.urg-media{background:#F59E0B}
.urg-baja{background:#34D399}
.crm-stage{border-bottom:1px solid var(--line)}
.crm-stage:last-child{border-bottom:0}
.crm-stage-h{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;padding:10px 20px 6px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.crm-stage-h span{background:#22262B;border-radius:20px;padding:1px 8px;margin-left:4px;font-size:12px}
.crm-card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 20px;flex-wrap:wrap}
.crm-card:hover{background:#1C2026}
.crm-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.crm-val{color:var(--accent-press);font-family:'Space Mono',monospace;font-size:13px}
.crm-actions{display:flex;align-items:center;gap:8px}
.crm-actions select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#10141A;color:var(--text)}
.buscador{font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#10141A;color:var(--text);width:100%;max-width:340px}
.buscador:focus{outline:2px solid var(--accent-tint);border-color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:16px 20px;background:#12151A;border-bottom:1px solid var(--line)}
.form-grid.hidden{display:none}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#10141A;color:var(--text);width:100%}
.field input::placeholder,.field textarea::placeholder{color:#5A636D}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-tint);border-color:var(--accent)}
.field.full{grid-column:1/-1}
.form-actions{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end}
.filterbar{display:flex;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);align-items:flex-end}
.filterbar .field{min-width:150px}
.muted-mini{font-size:12px;color:var(--muted);text-transform:capitalize}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:13px 20px;border-bottom:1px solid var(--line)}
.aviso:last-child{border-bottom:0}
.aviso b{display:block;font-size:14px;font-weight:600}
.aviso>div>span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.aviso span[class^="dot-"]{display:inline-block;width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0}
.dot-cyan{background:var(--accent)} .dot-amber{background:#F59E0B} .dot-red{background:#FF3547}
.catbar{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.dayrow{display:flex;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line)}
.dayrow:last-child{border-bottom:0}
.dayrow.is-today{background:rgba(0,178,255,.06)}
.dayhead{width:118px;flex-shrink:0;font-weight:600;font-size:14px;font-family:'Space Grotesk',sans-serif}
.dayhead span{display:block;font-size:12px;color:var(--muted);font-family:'Inter',sans-serif;font-weight:500}
.daytasks{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.noday{color:#3C434B;font-size:13px}
.task{display:flex;align-items:center;gap:10px}
.task-t{flex:1;font-size:14px;min-width:0}
.task.done .task-t{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;border:1.5px solid var(--line);border-radius:6px;background:transparent;color:var(--accent);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.task.done .chk{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.catchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:transparent;border:1px solid var(--c);color:var(--c)}
.catchip.sm{padding:2px 8px;font-size:11px}
.catchip button{background:transparent;border:0;color:inherit;cursor:pointer;opacity:.6;padding:0;font-size:11px;line-height:1}
.catchip button:hover{opacity:1}
@media(max-width:860px){.dayhead{width:84px}}
#login-gate{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:34px 30px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.login-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.06em;font-size:20px;text-align:center}
.login-sub{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.16em;text-align:center;margin-bottom:10px}
.login-card input{font:inherit;font-size:14px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#10141A;color:var(--text)}
.login-card input:focus{outline:2px solid var(--accent-tint);border-color:var(--accent)}
.login-card .btn{justify-content:center;margin-top:4px}
.login-err{color:#FF3547;font-size:13px;min-height:18px;text-align:center}
.seg-row{display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid var(--line)}
.seg-row:last-child{border-bottom:0}
.seg-name{flex:1;font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg-days{font-size:12px;color:var(--muted);white-space:nowrap}
.seg-days.neg{color:var(--red-text);font-weight:600}
.prov{color:var(--muted);font-size:11px}
.fx-edit{max-width:780px;margin:20px auto;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:22px;color:var(--text)}
.who{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 8px;white-space:nowrap}
.fx-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.fx-actions{display:flex;gap:10px}
.fx-doc{background:#fff;color:#111;width:100%;max-width:720px;padding:40px;border-radius:8px;font-size:14px}
.fx-doc td,.fx-doc th,.fx-doc div,.fx-doc b,.fx-doc span{color:#111}
.fx-doc .fx-h{color:#888}
.fx-doc .fx-pay{color:#444}
.fx-doc .fx-note{color:#666}
.fx-doc .fx-table th{color:#333}
.fx-top{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px}
.fx-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;letter-spacing:-.01em}
.fx-num{font-weight:600;margin-top:4px}
.fx-box{border:1px solid #ddd;border-radius:6px;padding:12px 14px;margin-bottom:14px;line-height:1.5}
.fx-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#888;font-weight:700;margin-bottom:4px}
.fx-table{width:100%;border-collapse:collapse;margin:8px 0}
.fx-table th{background:#f4f4f4;color:#333;padding:8px 10px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.fx-table td{padding:10px;border-bottom:1px solid #eee;color:#111;white-space:normal}
.fx-tot{margin-left:auto;max-width:300px;margin-top:8px}
.fx-tot>div{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.fx-tot .fx-total{border-top:2px solid #111;margin-top:6px;padding-top:8px;font-weight:700;font-size:17px;font-family:'Space Grotesk',sans-serif}
.fx-pay{margin-top:18px;font-size:13px;color:#444}
.fx-note{margin-top:8px;font-size:12px;color:#666}
@media print{ @page{size:A4;margin:0} body.printing *{visibility:hidden} body.printing #fx-print, body.printing #fx-print *{visibility:visible} #fx-print{position:absolute;left:0;top:0;width:100%;padding:14mm} .fx-overlay{position:static;background:#fff;padding:0} .fx-actions{display:none} }
.cal-top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.cal-top .month{font-family:'Space Grotesk';font-weight:600;font-size:17px;text-transform:capitalize}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:34px;height:34px;border:1px solid var(--line);background:#1B1F24;border-radius:9px;cursor:pointer;font-size:16px;color:var(--text)}
.cal-nav button:hover{border-color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
.cal-cell{min-height:92px;min-width:0;overflow:hidden;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;position:relative;transition:.12s}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell:hover{background:rgba(255,255,255,.05)}
.cal-cell.out{background:rgba(0,0,0,.25);color:#3C434B;cursor:default}
.cal-cell.out:hover{background:rgba(0,0,0,.25)}
.cal-cell .dnum{font-size:13px;font-weight:600;color:var(--muted)}
.cal-cell.today{outline:2px solid var(--accent);outline-offset:-3px;background:rgba(0,178,255,.10);z-index:1}
.cal-cell.today .dnum{background:transparent;color:var(--accent);width:auto;height:auto;border-radius:0;font-weight:700}
.ev-x{float:right;margin-left:4px;opacity:0;color:#FF3547;font-weight:700;cursor:pointer;padding:0 2px;line-height:1}
.ev-chip:hover .ev-x{opacity:1}
.ev-chip{font-size:11px;background:rgba(0,178,255,.16);color:#7FD6FF;border-radius:5px;padding:2px 5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ev-venc{font-size:11px;background:rgba(167,139,250,.20);color:#9B7BF0;border-radius:5px;padding:2px 5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.info{background:#12151A;border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:14px;color:var(--muted);line-height:1.6}
.info b{color:var(--text)}
.info ol{margin:8px 0 0 18px}
.info li{margin-bottom:4px}

/* ---------- Móvil: pestañas siguen VERTICALES (rail de iconos) ---------- */
@media(max-width:860px){
  .sidebar{width:66px;padding:16px 8px;gap:6px}
  .brand{justify-content:center;padding:2px 0 16px;gap:0}
  .brandtxt{display:none}
  .brand .logo{width:42px;height:42px}
  .nav-btn{justify-content:center;padding:12px 0}
  .nav-btn .lbl{display:none}
  .nav-btn.active::before{display:none}
  .side-foot{display:none}

async function loadAll(){
  for(var coll in SPECS){
    var res=await sb.from(SPECS[coll].table).select('*');
    if(res.error){ console.error(SPECS[coll].table,res.error); state[coll]=[]; }
    else { (function(c,data){ state[c]=data.map(function(r){return rowFromDB(c,r);}); })(coll,res.data||[]); }
  }
  var tc=await sb.from('tarea_categorias').select('nombre');
  state.tareaCats=(tc.data||[]).map(function(x){return x.nombre;});
  var cf=await sb.from('config').select('*').eq('id',1).single();
  var c=cf.data||{};

  state.series={}; (sr.data||[]).forEach(function(r){ state.series[r.serie+'|'+r.anio]=r.ultimo; });
  pruneEventos();

}

var saving=false, saveQueued=false;
async function save(){
  if(!loaded) return;
  if(saving){ saveQueued=true; return; }
  saving=true; var __fail=false;
  try{
    for(var coll in SPECS){
      var rows=(state[coll]||[]).map(function(r){return rowToDB(coll,r);});
      if(rows.length){ var up=await sb.from(SPECS[coll].table).upsert(rows); if(up.error){ console.error('upsert',SPECS[coll].table,up.error); __fail=true; } }
    }
    var cats=state.tareaCats||[];
    if(cats.length){ await sb.from('tarea_categorias').upsert(cats.map(function(n){return {nombre:n};})); }
    var em=state.emisor||{};
    await sb.from('config').update({emisor_nombre:em.nombre||null,emisor_nif:em.nif||null,emisor_direccion:em.direccion||null,emisor_email:em.email||null,emisor_iban:em.iban||null,iva_default:(em.ivaDefault||0),tipo_default:(em.tipoDefault||'auto'),saldo_banco:(em.saldoBanco||0),foto_perfil:(em.fotoPerfil||null)}).eq('id',1);
  }catch(e){ console.error(e); __fail=true; }
  saving=false; if(__fail) showToast('⚠️ No se pudo guardar todo en la nube. Revisa tu conexión e inténtalo otra vez.', true, 9000);
  if(saveQueued){ saveQueued=false; save(); }
}

function lineChart(series, labels){

  function Y(v){ return padT+(H-padT-padB)*(1-v/max); }

  var xlabels=labels.map(function(l,i){ return '<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+esc(l)+'</text>'; }).join('');
  var paths=series.map(function(s){ var pts=s.values.map(function(v,i){ return X(i)+','+Y(v); }).join(' '); var dots=s.values.map(function(v,i){ return '<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3" fill="'+s.color+'"/>'; }).join(''); return '<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots; }).join('');

  return '<div style="padding:16px 20px">'+legend+'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;margin-top:8px">'+grid+paths+xlabels+'</svg></div>';
}
function barChart(series, labels){
  var W=640,H=220,padL=52,padR=16,padT=14,padB=26;
  var all=[]; series.forEach(function(s){ all=all.concat(s.values); });
  var max=Math.max.apply(null, all.concat([0])); if(max<=0) max=1;
  var n=labels.length, plotW=W-padL-padR, plotH=H-padT-padB, groupW=plotW/n;
  var gp=groupW*0.16, gap=5, bw=(groupW-2*gp-gap*(series.length-1))/series.length;
  function Y(v){ return padT+plotH*(1-v/max); }
  var grid='', ticks=4;
  for(var t=0;t<=ticks;t++){ var gv=max*t/ticks, gy=Y(gv); grid+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--line)" stroke-width="1"/><text x="'+(padL-8)+'" y="'+(gy+3)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+Math.round(gv)+'</text>'; }
  var bars='';
  for(var i=0;i<n;i++){ var gx=padL+groupW*i+gp;
    for(var si=0;si<series.length;si++){ var v=series[si].values[i]||0, by=Y(v), bh=(padT+plotH)-by, x=gx+si*(bw+gap);
      bars+='<rect x="'+x+'" y="'+by+'" width="'+bw+'" height="'+Math.max(0,bh)+'" fill="'+series[si].color+'" rx="2"/>'; } }
  var xlabels=labels.map(function(l,i){ return '<text x="'+(padL+groupW*i+groupW/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+esc(l)+'</text>'; }).join('');
  var legend=series.map(function(s){ return '<span style="display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:12px;color:var(--muted)"><span style="width:10px;height:10px;border-radius:2px;background:'+s.color+';display:inline-block"></span>'+esc(s.name)+'</span>'; }).join('');

}
function barChartSigned(values, labels){

  var bars='';

    bars+='<rect x="'+x+'" y="'+top+'" width="'+bw+'" height="'+Math.max(1,hh)+'" fill="'+col+'" rx="2"/>'; }
  var xlabels=labels.map(function(l,i){ return '<text x="'+(padL+groupW*i+groupW/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+esc(l)+'</text>'; }).join('');

}

function pagoEstado(a){
  if(a.estado!=='activo') return null;
  if(a.pagoManual===hoy().slice(0,7)) return {txt:'Pagado', cls:'b-green', impago:false};
  if(a.pagoUnico){ var tU=hoy(); if(a.fechaAlta && tU>=a.fechaAlta && (!a.fechaVencimiento || tU<=a.fechaVencimiento)) return {txt:'Pagado', cls:'b-green', impago:false}; }
  var now=new Date(), mm=now.getMonth(), yy=now.getFullYear();
  var pagado=(state.finanzas||[]).some(function(fx){ if(fx.tipo!=='ingreso'||fx.cliente!==a.id) return false; var d=new Date(fx.fecha); return d.getMonth()===mm&&d.getFullYear()===yy; });
  if(pagado) return {txt:'Pagado', cls:'b-green', impago:false};
  var dia=parseInt(a.diaCobro,10);
  if(dia && now.getDate()>dia) return {txt:'Impago', cls:'b-impago', impago:true};
  if(dia) return {txt:'Se cobra el '+dia, cls:'b-amber', impago:false};
  return {txt:'Pendiente', cls:'b-gray', impago:false};
}

  if(!act.length) return '<div class="empty" style="padding:24px"><b>Sin clientes activos</b></div>';

}
function recsDelDia(ds){
  var out=[];
  var hoyD=new Date(hoy()+'T00:00:00');
  (state.altas||[]).forEach(function(a){
    if(a.estado!=='activo'||!a.fechaVencimiento) return;
    var v=new Date(a.fechaVencimiento+'T00:00:00'); if(isNaN(v.getTime())) return;
    if(ymd(v)!==ds) return;
    var dias=Math.round((v-hoyD)/86400000);
    var nivel = dias<=7 ? 'rojo' : (dias<=30 ? 'naranja' : 'verde');
    var lbl = dias<0 ? 'vencida' : dias+'d';
    out.push({nombre:a.nombre, lbl:lbl, nivel:nivel, id:a.id});
  });
  return out;

function previsionIngresos(){

function finTipoChange(){ var tipo=document.getElementById('f-tipo').value; var cat=document.getElementById('f-cat'); var lbl=document.getElementById('f-cat-label'); var opts=(tipo==='ingreso')?['Abanca/Transf.','Stripe','Hotmart','Efectivo','Otro']:(tipo==='impago'?['Cuota no pagada','Otro']:CATEGORIAS); if(cat) cat.innerHTML=opts.map(function(o){return '<option>'+o+'</option>';}).join(''); if(lbl) lbl.textContent=(tipo==='ingreso')?'Por dónde se hizo':(tipo==='impago'?'Motivo del impago':'Tipo de gasto'); }
function exportTrimestre(){
  var y=new Date().getFullYear();
  var q=prompt('¿Qué trimestre exportar del año '+y+'? (1, 2, 3 o 4)', String(Math.floor(new Date().getMonth()/3)+1));
  q=parseInt(q,10); if(!(q>=1&&q<=4)){ return; }
  var m0=(q-1)*3; var desde=y+'-'+String(m0+1).padStart(2,'0')+'-01'; var hasta=y+'-'+String(m0+3).padStart(2,'0')+'-31';
  var movs=(state.finanzas||[]).filter(function(fx){return (fx.fecha||'')>=desde && (fx.fecha||'')<=hasta;}).sort(function(a,b){return (a.fecha||'').localeCompare(b.fecha||'');});
  var rows=[['Fecha','Tipo','Concepto','Etiqueta','Importe','Cliente']];
  var totI=0, totG=0;
  movs.forEach(function(fx){ var cli=(state.altas||[]).find(function(x){return x.id===fx.cliente;}); var imp=+(fx.importe||0); if(fx.tipo==='ingreso') totI+=imp; else totG+=imp; rows.push([fx.fecha||'', fx.tipo||'', fx.concepto||'', (fx.tipo==='ingreso'?(fx.fuente||''):(fx.categoria||'')), String(imp).replace('.',','), cli?cli.nombre:'']); });
  rows.push([]); rows.push(['','','','Total ingresos', String(totI).replace('.',','),'']); rows.push(['','','','Total gastos', String(totG).replace('.',','),'']); rows.push(['','','','Balance', String(totI-totG).replace('.',','),'']);
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(';');}).join('\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='movimientos-T'+q+'-'+y+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}

function guardarMovimiento(id){
  var f=(state.finanzas||[]).find(function(x){return x.id===id;}); if(!f) return;
  var tipo=document.getElementById('em-tipo').value;
  var etq=(document.getElementById('em-etq').value||'').trim();
  f.fecha=document.getElementById('em-fecha').value||f.fecha;
  f.tipo=tipo;
  f.concepto=(document.getElementById('em-concepto').value||'').trim();
  f.importe=parseFloat(document.getElementById('em-importe').value)||0;
  f.cliente=document.getElementById('em-cli').value||'';
  if(tipo==='ingreso'){ f.fuente=etq; f.categoria='Ingreso'; } else { f.categoria=etq; f.fuente=''; }
  cerrarFactura(); save(); render();
  showToast('Movimiento actualizado.', false, 3000);
}

async function addFinanza(){
  const importe=parseFloat(document.getElementById('f-importe').value);
  const concepto=document.getElementById('f-concepto').value.trim();
  if(!concepto||isNaN(importe)){ alert('Añade concepto e importe.'); return; }
  const cli=(document.getElementById('f-cli')||{}).value||'';
  const tipo=document.getElementById('f-tipo').value; const etq=document.getElementById('f-cat').value;
  const mov={id:uid(),fecha:document.getElementById('f-fecha').value||hoy(),tipo,concepto,categoria:(tipo==='ingreso'?'Ingreso':etq),importe,cliente:cli,fuente:(tipo==='ingreso'?etq:'')};
  state.finanzas.push(mov);
  if(mov.tipo==='ingreso'&&cli){ await generarFacturaDesdePago(mov); }
  save(); render();
}

function drawBoxPDF(doc, x, y, w, title, lines){
  doc.setFontSize(9.5); var wrapped=[];
  lines.forEach(function(ln,i){ var parts=doc.splitTextToSize(String(ln), w-8); parts.forEach(function(p,j){ wrapped.push({t:p, head:(i===0&&j===0)}); }); });
  var hh=9+wrapped.length*4.8+3;
  doc.setDrawColor(210,210,210); doc.setLineWidth(0.3); doc.roundedRect(x, y, w, hh, 2, 2);
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(136,136,136); doc.text(String(title), x+4, y+5.5);
  doc.setTextColor(17,17,17); var yy=y+11;
  wrapped.forEach(function(o){ doc.setFont('helvetica', o.head?'bold':'normal'); doc.setFontSize(o.head?11:9.5); doc.text(o.t, x+4, yy); yy+=4.8; });
  return y+hh;
}
function descargarPDF(id){
  var f=(state.facturas||[]).find(function(x){return x.id===id;}); if(!f) return;
  var JS=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF||(typeof jsPDF!=='undefined'?jsPDF:null);
  if(!JS){ if(!document.getElementById('fx-print')) verFactura(id); alert('Para guardar en PDF: en la vista previa pulsa Imprimir y elige «Guardar como PDF».'); return; }
  var em=state.emisor||{};
  var eur2=function(n){ return (Number(n||0)).toFixed(2).replace('.',',')+' \u20ac'; };
  var doc=new JS({unit:'mm',format:'a4'});
  var W=210, M=18;
  doc.setTextColor(17,17,17);
  doc.setFont('helvetica','bold'); doc.setFontSize(22);
  doc.text('FACTURA'+(f.tipo==='simplificada'?' SIMPLIFICADA':''), M, 24);
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); var y=31;
  doc.text(f.estado==='emitida'?('N\u00ba '+(f.numero||'')):'BORRADOR \u2014 sin n\u00famero asignado', M, y); y+=5;
  doc.text('Fecha de expedici\u00f3n: '+fFecha(f.fecha), M, y);
  if(f.periodo){ y+=5; doc.text('Periodo: '+f.periodo, M, y); }
  var emLines=[]; if(em.nombre) emLines.push(em.nombre); if(em.nif) emLines.push('NIF: '+em.nif); if(em.direccion) emLines.push(em.direccion); if(em.email) emLines.push(em.email);
  var emBottom=drawBoxPDF(doc, 123, 16, W-M-123, 'EMISOR', emLines.length?emLines:['\u2014']);
  var cy=Math.max(y, emBottom)+10;
  var clLines=[]; if(f.clienteNombre) clLines.push(f.clienteNombre); if(f.tipo==='nominativa'){ if(f.clienteNif) clLines.push('NIF: '+f.clienteNif); if(f.clienteDir) clLines.push(f.clienteDir); }
  if(clLines.length){ cy=drawBoxPDF(doc, M, cy, W-2*M, 'CLIENTE', clLines)+9; }
  var ty=cy;
  doc.setFillColor(244,244,244); doc.rect(M, ty, W-2*M, 8, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(51,51,51);
  doc.text('CONCEPTO', M+3, ty+5.5); doc.text('IMPORTE', W-M-3, ty+5.5, {align:'right'});
  ty+=8; doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(17,17,17);
  var concepto=(f.concepto||'')+(f.periodo?(' ('+f.periodo+')'):'');
  var cLines=doc.splitTextToSize(concepto, W-2*M-42);
  doc.text(cLines, M+3, ty+6); doc.text(eur2(f.base), W-M-3, ty+6, {align:'right'});
  ty+=Math.max(11, cLines.length*5+6);
  doc.setDrawColor(230,230,230); doc.setLineWidth(0.3); doc.line(M, ty, W-M, ty);
  var tx=W-M-72, yy=ty+9;
  var row=function(label,val,bold){ doc.setFont('helvetica',bold?'bold':'normal'); doc.setFontSize(bold?13:10.5); doc.setTextColor(17,17,17); doc.text(label, tx, yy); doc.text(val, W-M, yy, {align:'right'}); yy+=bold?9:6; };
  row('Base imponible', eur2(f.base));
  row('IVA ('+(f.ivaPct||0)+'%)', eur2(f.ivaCuota));
  if(f.irpfPct){ row('Retenci\u00f3n IRPF ('+f.irpfPct+'%)', '\u2212'+eur2(f.irpfCuota)); }
  doc.setDrawColor(17,17,17); doc.setLineWidth(0.5); doc.line(tx, yy-2, W-M, yy-2); yy+=3;
  row('TOTAL', eur2(f.total), true);
  yy+=8; doc.setTextColor(68,68,68); doc.setFont('helvetica','normal'); doc.setFontSize(10);
  if(em.iban){ doc.text('Forma de pago \u2014 transferencia: '+em.iban, M, yy); yy+=6; }
  if((f.ivaPct||0)===0){ doc.setTextColor(102,102,102); doc.setFontSize(9); doc.text('Operaci\u00f3n exenta de IVA.', M, yy); }
  doc.save('Factura-'+String(f.numero||'borrador').replace(/\//g,'-')+'.pdf');
}

var _crop=null;
function abrirRecorteFoto(dataUrl){
  var img=new Image();
  img.onload=function(){
    var CB=240; var minS=CB/Math.min(img.width,img.height);
    _crop={img:img, CB:CB, scale:minS, minS:minS, ox:(CB-img.width*minS)/2, oy:(CB-img.height*minS)/2, drag:false, lx:0, ly:0};
    var ov=getOverlay();
    ov.innerHTML='<div class="fx-overlay"><div class="fx-edit" style="max-width:330px;text-align:center">'
      +'<h3 style="margin:0 0 12px">Ajusta tu foto</h3>'
      +'<div id="crop-box" style="position:relative;width:'+CB+'px;height:'+CB+'px;margin:0 auto;border-radius:50%;overflow:hidden;background:#0e141c;cursor:grab;touch-action:none;border:2px solid rgba(255,255,255,.2)">'
      +'<img id="crop-img" src="'+dataUrl+'" style="position:absolute;left:0;top:0;user-select:none;pointer-events:none;max-width:none">'
      +'</div>'
      +'<div style="margin:14px 0 6px;color:var(--muted);font-size:12px">Arrastra para mover · desliza para acercar</div>'
      +'<input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1" style="width:100%">'
      +'<div class="fx-actions" style="margin-top:14px;justify-content:center;gap:10px"><button class="btn ghost" onclick="cerrarFactura()">Cancelar</button><button class="btn" onclick="guardarFotoRecorte()">Guardar foto</button></div>'
      +'</div></div>';
    document.body.classList.add('printing');
    _cropApply(); _cropBind();
  };
  img.src=dataUrl;
}
function _cropApply(){
  var s=_crop; if(!s) return; var im=document.getElementById('crop-img'); if(!im) return;
  s.ox=Math.min(0, Math.max(s.CB - s.img.width*s.scale, s.ox));
  s.oy=Math.min(0, Math.max(s.CB - s.img.height*s.scale, s.oy));
  im.style.width=(s.img.width*s.scale)+'px'; im.style.height=(s.img.height*s.scale)+'px';
  im.style.left=s.ox+'px'; im.style.top=s.oy+'px';
}
function _cropBind(){
  var s=_crop; var box=document.getElementById('crop-box'); var zoom=document.getElementById('crop-zoom');
  var ovl=box.closest('.fx-overlay');
  var start=function(x,y){ s.drag=true; s.lx=x; s.ly=y; box.style.cursor='grabbing'; };
  var move=function(x,y){ if(!s.drag) return; s.ox+=(x-s.lx); s.oy+=(y-s.ly); s.lx=x; s.ly=y; _cropApply(); };
  var end=function(){ s.drag=false; box.style.cursor='grab'; };
  box.onmousedown=function(e){ e.preventDefault(); start(e.clientX,e.clientY); };
  ovl.onmousemove=function(e){ move(e.clientX,e.clientY); };
  ovl.onmouseup=end; ovl.onmouseleave=end;
  box.ontouchstart=function(e){ var t=e.touches[0]; start(t.clientX,t.clientY); };
  box.ontouchmove=function(e){ e.preventDefault(); var t=e.touches[0]; move(t.clientX,t.clientY); };
  box.ontouchend=end;
  zoom.oninput=function(){ var ns=s.minS*parseFloat(zoom.value); var cx=s.CB/2, cy=s.CB/2; var ix=(cx-s.ox)/s.scale, iy=(cy-s.oy)/s.scale; s.scale=ns; s.ox=cx-ix*s.scale; s.oy=cy-iy*s.scale; _cropApply(); };
}
function guardarFotoRecorte(){
  var s=_crop; if(!s) return;
  var out=240, cv=document.createElement('canvas'); cv.width=out; cv.height=out; var ctx=cv.getContext('2d');
  var srcX=-s.ox/s.scale, srcY=-s.oy/s.scale, srcSize=s.CB/s.scale;
  ctx.drawImage(s.img, srcX, srcY, srcSize, srcSize, 0, 0, out, out);
  var data=cv.toDataURL('image/jpeg', 0.85);
  if(!state.emisor) state.emisor={}; state.emisor.fotoPerfil=data;

async function emitirFactura(id){
  var f=(state.facturas||[]).find(function(x){return x.id===id;}); if(!f||f.estado==='emitida') return;
  if(f.tipo==='nominativa' && (!f.clienteNif || !f.clienteDir)){ if(!confirm('Una factura NOMINATIVA debe incluir NIF/DNI y dirección del cliente, y faltan. Cancela para editarla y añadirlos, o Aceptar para emitir igualmente.')) return; }
  if(!confirm('¿Emitir esta factura? El número quedará fijado.')) return;
  var anio=parseInt((f.fecha||hoy()).slice(0,4),10); var k=f.tipo+'|'+anio;
  if(f.numero){
    var pn=parseInt(String(f.numero).split('/')[0],10); f.estado='emitida';
    if(!isNaN(pn)){ if(!state.series) state.series={}; state.series[k]=Math.max(state.series[k]||0,pn); try{ await sb.rpc('bump_factura_series',{p_serie:f.tipo,p_anio:anio,p_n:pn}); }catch(e){} }
  } else {
    var r=await sb.rpc('next_factura_numero',{p_serie:f.tipo,p_anio:anio});
    if(r.error||!r.data){ alert('No se pudo emitir la factura.'); return; }
    f.numero=r.data; f.estado='emitida';
    if(!state.series) state.series={}; state.series[k]=parseInt(String(r.data).split('/')[0],10);
  }
  save(); render();
}
async function emitirTodos(tipo){
  var draftsAll=(state.facturas||[]).filter(function(x){return x.estado!=='emitida' && (!tipo || x.tipo===tipo);});
  if(!draftsAll.length){ alert('No hay borradores que emitir.'); return; }
  if(!confirm('¿Emitir '+draftsAll.length+' borrador(es) por orden de fecha de pago? Los números quedarán fijados.')) return;
  var faltan=draftsAll.filter(function(x){return x.tipo==='nominativa'&&(!x.clienteNif||!x.clienteDir);});
  if(faltan.length && !confirm(faltan.length+' factura(s) nominativa(s) no llevan NIF/DNI y dirección del cliente (obligatorio). ¿Emitir igualmente?')) return;
  draftsAll.sort(function(a,b){return (a.fecha||'').localeCompare(b.fecha||'');});
  for(var i=0;i<draftsAll.length;i++){
    var f=draftsAll[i]; var anio=parseInt((f.fecha||hoy()).slice(0,4),10); var k=f.tipo+'|'+anio;
    if(f.numero){ var pn=parseInt(String(f.numero).split('/')[0],10); f.estado='emitida'; if(!isNaN(pn)){ if(!state.series)state.series={}; state.series[k]=Math.max(state.series[k]||0,pn); try{ await sb.rpc('bump_factura_series',{p_serie:f.tipo,p_anio:anio,p_n:pn}); }catch(e){} } }
    else { var r=await sb.rpc('next_factura_numero',{p_serie:f.tipo,p_anio:anio}); if(!r.error&&r.data){ f.numero=r.data; f.estado='emitida'; if(!state.series) state.series={}; state.series[k]=parseInt(String(r.data).split('/')[0],10); } }
  }
  save(); render();
}
async function generarFacturaDesdePago(mov){
  var em=state.emisor||{};

  var c=state.altas.find(function(x){return x.id===mov.cliente;})||{};

    </div>
    <div class="panel-body">
      ${ETAPAS.map(function(et){ var ls=leads.filter(function(l){return (l.etapa||'nuevo')===et[0];}); if(!ls.length&&(et[0]==='ganado'||et[0]==='perdido')) return ''; return `<div class="crm-stage"><div class="crm-stage-h">${et[1]} <span>${ls.length}</span></div>${ls.length?ls.map(l=>leadCard(l)).join(''):'<div class="noday" style="padding:6px 20px">—</div>'}</div>`; }).join('')}
    </div>
  </div>`;
}
function leadCard(l){
  var E=[['nuevo','Nuevo'],['contactado','Contactado'],['agendado','Agendado'],['llamada','Llamada'],['ganado','Ganado'],['perdido','Perdido']];
  var opts=E.map(function(e){return '<option value="'+e[0]+'"'+((l.etapa||'nuevo')===e[0]?' selected':'')+'>'+e[1]+'</option>';}).join('');
  return `<div class="crm-card"><div class="crm-main"><b>${esc(l.nombre)}</b>${l.fuente?` <span class="badge b-gray">${esc(l.fuente)}</span>`:''}${l.valor?` <span class="crm-val">${eur(l.valor)}</span>`:''}${l.asignado?`<span class="who">${esc(miembroNombre(l.asignado))}</span>`:''}</div><div class="crm-actions"><select onchange="moverLead('${l.id}',this.value)">${opts}</select>${l.etapa==='ganado'?`<button class="btn sm" onclick="convertirLead('${l.id}')">A cliente</button>`:''}<button class="del" onclick="delItem('leads','${l.id}')">✕</button></div></div>`;
}
var crmMes='';
function setCrmMes(v){ crmMes=v; render(); }
function addLead(){
  var nombre=val('l-nombre'); if(!nombre){ alert('Indica el nombre del lead.'); return; }
  if(!state.leads) state.leads=[];
  state.leads.push({id:uid(),nombre:nombre,email:val('l-email'),telefono:val('l-tel'),fuente:document.getElementById('l-fuente').value,tipo:document.getElementById('l-tipo').value,valor:parseFloat(document.getElementById('l-valor').value)||0,asignado:document.getElementById('l-asig').value,notas:val('l-notas'),etapa:'nuevo',fecha:hoy()});
  toggleForm('l-form'); save(); render();
}
function moverLead(id,etapa){ var l=(state.leads||[]).find(function(x){return x.id===id;}); if(l){ l.etapa=etapa; save(); render(); } }
function convertirLead(id){
  var l=(state.leads||[]).find(function(x){return x.id===id;}); if(!l) return;
  if(!confirm('¿Convertir "'+l.nombre+'" en cliente (Alta)?')) return;
  if(!state.altas) state.altas=[];
  state.altas.push({id:uid(),nombre:l.nombre,deporte:'',lesion:'',entrenador:'',fechaAlta:hoy(),tarifa:l.valor||0,estado:'activo',nif:'',direccion:'',email:l.email||'',tipoCliente:l.tipo||'',diaCobro:null,fechaVencimiento:null,ultimoContacto:hoy()});
  save(); render(); alert('Convertido a cliente. Revisa su ficha en Altas.');
}

function viewDatos(){
  const n=state;
  return `
  <div class="page-head"><div><div class="eyebrow">Backup</div><h1>Data</h1>
  <p>Tus datos se guardan en este dispositivo. Para pasarlos entre el móvil y el portátil —o para no perderlos nunca— usa la copia de seguridad.</p></div></div>
  <div class="kpis">
    <div class="kpi"><div class="label">Movimientos</div><div class="val">${n.finanzas.length}</div></div>
    <div class="kpi"><div class="label">Altas</div><div class="val">${n.altas.length}</div></div>
    <div class="kpi"><div class="label">Videollamadas</div><div class="val">${n.videollamadas.length}</div></div>
    <div class="kpi"><div class="label">Eventos</div><div class="val">${n.eventos.length}</div></div>
    <div class="kpi"><div class="label">Tareas</div><div class="val">${(n.tareas||[]).length}</div></div>
    <div class="kpi"><div class="label">Equipo</div><div class="val">${(n.equipo||[]).length}</div></div>
    <div class="kpi"><div class="label">Facturas</div><div class="val">${(n.facturas||[]).length}</div></div>
  </div>
  <div class="panel"><div class="panel-head"><h3>Exportar / importar</h3></div>
    <div class="panel-body" style="padding:20px;display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn" onclick="exportarBackup()">↓ Exportar copia (.json)</button>
      <button class="btn ghost" onclick="document.getElementById('imp').click()">↑ Importar copia</button>
      <input type="file" id="imp" accept="application/json,.json" style="display:none" onchange="importarBackup(this)">
    </div>
  </div>
  <div class="panel"><div class="panel-head"><h3>Cómo usarlo entre móvil y portátil</h3></div>
    <div style="padding:16px 20px"><div class="info">
      Como cada dispositivo guarda por su cuenta, elige un flujo y sé constante:
      <ol>
        <li><b>Trabaja siempre en un equipo "principal"</b> (p. ej. el portátil).</li>
        <li>Al terminar, pulsa <b>Exportar copia</b> y guarda el archivo en tu Drive o iCloud.</li>
        <li>En el otro dispositivo, abre ese archivo y pulsa <b>Importar copia</b> para ponerlo al día.</li>
        <li>Evita editar en los dos a la vez: la última importación <b>reemplaza</b> lo anterior.</li>
      </ol>
      Cuando este baile se te haga pesado, es la señal de dar el salto a la versión en la nube.
    </div></div>
  </div>`;
}
function exportarBackup(){ bajarArchivo('bfh-backup-'+hoy()+'.json', JSON.stringify(state,null,2), 'application/json'); }
function importarBackup(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data||typeof data!=='object') throw 0;
      if(!confirm('Esto reemplazará los datos actuales de este dispositivo por los de la copia. ¿Continuar?')){ input.value=''; return; }
      state={ finanzas:data.finanzas||[], altas:data.altas||[], videollamadas:data.videollamadas||[], eventos:data.eventos||[], tareas:data.tareas||[], tareaCats:data.tareaCats||[], equipo:data.equipo||[], emisor:data.emisor||{}, facturas:data.facturas||[], leads:data.leads||[], documentos:data.documentos||[], publicidad:data.publicidad||[], renovLog:data.renovLog||[] };
      save(); render(); alert('Copia importada correctamente.');
    }catch(e){ alert('El archivo no es una copia válida del panel.'); }
    input.value='';
  };
  reader.readAsText(file);
}

var lastDeleted=null;
function showToast(html, isErr, ms){ var t=document.getElementById('bfh-toast'); if(!t){ t=document.createElement('div'); t.id='bfh-toast'; document.body.appendChild(t); } t.className='bfh-toast'+(isErr?' err':''); t.innerHTML=html; t.style.display='flex'; clearTimeout(window.__tt); if(ms) window.__tt=setTimeout(hideToast, ms); }
function hideToast(){ var t=document.getElementById('bfh-toast'); if(t) t.style.display='none'; }
function toastUndo(msg){ showToast('<span>'+msg+'</span><button onclick="deshacerBorrado()">Deshacer</button>', false, 8000); }
function deshacerBorrado(){ if(!lastDeleted||!lastDeleted.item) return; if(!state[lastDeleted.coll]) state[lastDeleted.coll]=[]; state[lastDeleted.coll].push(lastDeleted.item); lastDeleted=null; hideToast(); save(); render(); }
function delItem(coll,id){ if(!confirm('¿Eliminar este registro? Podrás deshacerlo justo después.')) return; var item=(state[coll]||[]).find(function(x){return x.id===id;}); lastDeleted={coll:coll, item:item}; state[coll]=state[coll].filter(x=>x.id!==id); dbDelete(coll,id); if(coll==='tareas'||coll==='videollamadas'){ var _pref=(coll==='tareas'?'tarea:':'vid:')+id; (state.eventos||[]).forEach(function(e){ if(e.origen===_pref) dbDelete('eventos', e.id); }); state.eventos=(state.eventos||[]).filter(function(e){return e.origen!==_pref;}); } save(); render(); toastUndo('Registro eliminado.'); }
function toggleForm(id){ const el=document.getElementById(id); if(el) el.classList.toggle('hidden'); }
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); tab=b.dataset.tab; render(); window.scrollTo(0,0);
}));
async function doLogin(){
  var email=(document.getElementById('lg-email').value||'').trim();
  var pass=document.getElementById('lg-pass').value||'';
  var err=document.getElementById('lg-err'); err.textContent='Entrando…';
  var res=await sb.auth.signInWithPassword({email:email,password:pass});
  if(res.error){ err.textContent='No se pudo entrar: '+res.error.message; return; }
  await entrar();
}
async function entrar(){
  var g=document.getElementById('login-gate'); if(g) g.style.display='none';
  await loadAll(); render();
  var s=document.getElementById('storeState'); if(s){ s.textContent='nube · Supabase'; s.style.color='var(--accent)'; }
}
async function logout(){ try{ await sb.auth.signOut(); }catch(e){} location.reload(); }
async function initApp(){
  try{ var res=await sb.auth.getSession(); if(res.data&&res.data.session){ await entrar(); return; } }catch(e){ console.error(e); }
  var g=document.getElementById('login-gate'); if(g) g.style.display='flex';
}
initApp();
</script>
